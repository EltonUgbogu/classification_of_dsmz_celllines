# config.yaml - Configuration for the expr_transformer project
# Absolute path to this repository on your cluster/host
# Update this path to match your system (e.g., /home/username/classification_of_dsmz_celllines)
project_root: "/home/user/classification_of_dsmz_celllines"

datasets:
  brca_hvg500:
    npz: "data/BRCA_HVG500_joint.npz"
    meta: "data/BRCA_HVG500_joint.meta.json"
    ckpt_prefix: "exprtf_brca_hvg500"

train:
  script: "train_mgm.py"  # Auto-detected in src/ directory
  epochs: 30
  batch_size: 256
  log_every: 100

export:
  script: "export_embeddings.py"  # Auto-detected in src/ directory
  batch_size: 512

paths:
  ckpt_dir: "ckpt"
  emb_dir: "embeddings"
  logs_dir: "logs"
  benchmarks_dir: "benchmarks"

