profiles:
  nbl:
    # Consume the count matrix and sample manifest produced by the active
    # tumour-purity rule; retained sample counts are determined at runtime.
    tumour_rds: "preprocessing_and_quality_control/nbl/results/tumour_purity_before_batch_correction/retained_raw_tumour_counts.rds"
    tumour_meta_csv: "data/nbl/count_data/nbl_tumour_sample_metadata.csv"
    retained_samples: "preprocessing_and_quality_control/nbl/results/tumour_purity_before_batch_correction/retained_samples.tsv"
    excluded_samples: "preprocessing_and_quality_control/nbl/results/tumour_purity_before_batch_correction/excluded_samples.tsv"
    purity_validation: "preprocessing_and_quality_control/nbl/results/tumour_purity_before_batch_correction/purity_stage_validation.ok"
    expected_tumour_samples: 235
    expected_tumour_cohorts: {}
    output_dir: "preprocessing_and_quality_control/nbl/results/batch_corr_and_normalisation/purity_filtered_preprocess"
    dsmz_rds: "preprocessing_and_quality_control/nbl/results/dsmz_input/DSMZ_nbl_raw_counts.rds"
    dsmz_meta_csv: "data/dsmz/DSMZ_metadata.csv"
    min_shared_genes: 5000
    tumour_label: "NBL_TUMOUR"
    dsmz_label: "DSMZ_NBL"
    dsmz_sample_col: "sample_name"
    dsmz_cellline_col: "Cell_Line"
    dsmz_filter_col: "Disease"
    dsmz_filter_values:
      - "Neuroblastoma"
    
