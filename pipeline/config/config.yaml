defaults:
  paths:
    tumour_nh_base_functions: R/base_functions
    agnostic_base_functions_dir: R
  clustering:
    k_grid: [2, 3, 4, 5, 6, 7, 8]
  feature_selection:
    method_topn:
      Variance:   3000
      MAD:        3000
      MeanAbsDev: 3000
      Entropy:    3000
      PCA:        3000
      Spearman:   500
      MX:         500
      kTotal:     500
  deseq2:
    sample_id_col: sample_id
    cell_line_col: cell_line
    component_col: component
    fdr_isolate: 0.01
    lfc_isolate: 1.5
    topN_isolate: 50
    fdr_anchor: 0.05
    lfc_anchor: 1.0
    topN_anchor: 200
    fdr_component: 0.05
    lfc_component: 1.0
    topN_component: 500
    min_baseMean: 10
    recurrence_k: 2

# Top-level pan_cancer block: read by PAN_CFG in the Snakefile to drive the
# pan-cancer joint-benchmark rules (feature_methods, dist_metrics, profiles,
# outdir, run_validation). Mirrors profiles.pan_cancer semantics.
pan_cancer:
  dist_metrics:
    - euc
    - corr
  feature_methods:
    - Variance
    - MAD
    - MeanAbsDev
    - Entropy
    - PCA
    - Spearman
    - MX
    - kTotal
  outdir: results/pan_cancer_joint_benchmark
  run_validation: true
  profiles:
    - brca
    - nbl
    - rbl
  tumour_neighbourhoods:
    p_consensus_threshold: 0.7
  validation:
    outdir: results/unsupervised/pan_cancer
  paths:
    unsup_root: results/pan_cancer_joint_benchmark/unsupervised
    vst_joint_rds: results/pan_cancer_joint_benchmark/inputs/joint_expr_matrix.rds
  features:
    hvg_joint_scores_tsv: results/pan_cancer_joint_benchmark/unsupervised/feature_selection/hvg_joint_scores.tsv
    hvg_final_gene_list: results/pan_cancer_joint_benchmark/unsupervised/feature_selection/hvg_final_gene_list.txt

profiles:
  # ---------------------------------------------------------------------------
  # pan_cancer — full 8-method × 2-distance grid; no PAM50
  # ---------------------------------------------------------------------------
  pan_cancer:
    analysis:
      cancer_type: Pan-Cancer
      use_pam50: false
    feature_sets:
      distances:
        - euc
        - corr
      methods:
        - Variance
        - MAD
        - MeanAbsDev
        - Entropy
        - PCA
        - Spearman
        - MX
        - kTotal
    paths:
      unsup_root: results/pan_cancer_joint_benchmark/unsupervised
      vst_joint_rds: results/pan_cancer_joint_benchmark/inputs/joint_expr_matrix.rds
      cell_vst_rds: results/pan_cancer_joint_benchmark/inputs/joint_expr_matrix.rds
      tumour_vst_rds: results/pan_cancer_joint_benchmark/inputs/joint_expr_matrix.rds
      dsmz_meta_csv: results/unsupervised/pan_cancer/inputs/joint_metadata.tsv
      meta_tsv: results/unsupervised/pan_cancer/inputs/joint_metadata.tsv
    tumour_neighbourhoods:
      directions:
        - Variance_euc
        - Variance_corr
        - MAD_euc
        - MAD_corr
        - MeanAbsDev_euc
        - MeanAbsDev_corr
        - Entropy_euc
        - Entropy_corr
        - PCA_euc
        - PCA_corr
        - Spearman_euc
        - Spearman_corr
        - MX_euc
        - MX_corr
        - kTotal_euc
        - kTotal_corr
    features:
      hvg_joint_scores_tsv: results/pan_cancer_joint_benchmark/unsupervised/feature_selection/hvg_joint_scores.tsv
      hvg_final_gene_list: results/pan_cancer_joint_benchmark/unsupervised/feature_selection/hvg_final_gene_list.txt

  # ---------------------------------------------------------------------------
  # brca — full 8-method × 2-distance grid
  # PAM50 disabled until tcga_brca_pam50_expr and dsmz_bcc_pam50_expr paths
  # are configured under paths. Re-enable use_pam50 and restore pam50_euc/
  # pam50_corr directions once those expression matrices are available.
  # ---------------------------------------------------------------------------
  brca:
    analysis:
      cancer_type: BRCA
      use_pam50: false
    feature_sets:
      distances:
        - euc
        - corr
      methods:
        - Variance
        - MAD
        - MeanAbsDev
        - Entropy
        - PCA
        - Spearman
        - MX
        - kTotal
    paths:
      unsup_root: results/unsupervised/brca
      vst_joint_rds: data/brca/bcc_analysis_results/vst_dsmz_bcc_tcga_brca_batch_corrected.rds
      cell_vst_rds: data/brca/bcc_analysis_results/vst_dsmz_bcc_tcga_brca_batch_corrected.rds
      tumour_vst_rds: data/brca/bcc_analysis_results/vst_dsmz_bcc_tcga_brca_batch_corrected.rds
      dsmz_counts_rds: data/dsmz/DSMZ_count_gene.rds
      dsmz_meta_csv: data/dsmz/DSMZ_metadata.csv
      meta_tsv: data/dsmz/DSMZ_metadata.csv
    tumour_neighbourhoods:
      directions:
        - Variance_euc
        - Variance_corr
        - MAD_euc
        - MAD_corr
        - MeanAbsDev_euc
        - MeanAbsDev_corr
        - Entropy_euc
        - Entropy_corr
        - PCA_euc
        - PCA_corr
        - Spearman_euc
        - Spearman_corr
        - MX_euc
        - MX_corr
        - kTotal_euc
        - kTotal_corr
    features:
      pam50_ensembl_gene_list: resources/pam50_ensembl_ids.txt
      hvg_joint_scores_tsv: results/unsupervised/brca/feature_selection_unsupervised/hvg_joint_scores.tsv
      hvg_final_gene_list: results/unsupervised/brca/feature_selection_unsupervised/hvg_final_gene_list.txt

  # ---------------------------------------------------------------------------
