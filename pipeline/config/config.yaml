defaults:
  paths:
    tumour_nh_base_functions: R/base_functions
    agnostic_base_functions_dir: R
  clustering:
    k_grid: [2, 3, 4, 5, 6, 7, 8]
  feature_selection:
    method_topn:
      Variance:   3000
      MAD:        3000
      MeanAbsDev: 3000
      Entropy:    3000
      PCA:        3000
      Spearman:   500
      MX:         500
      kTotal:     500
pan_cancer:
  dist_metrics:
  - cosine
  - euclidean
  feature_methods:
  - Variance
  - MAD
  - Entropy
  outdir: results/pan_cancer_joint_benchmark
  run_validation: true
  profiles:
  - brca
  - nbl
  - rbl
  tumour_neighbourhoods:
    p_consensus_threshold: 0.7
  validation:
    outdir: results/unsupervised/pan_cancer
  paths:
    unsup_root: results/pan_cancer_joint_benchmark/unsupervised
    vst_joint_rds: results/pan_cancer_joint_benchmark/inputs/joint_expr_matrix.rds
  features:
    hvg_joint_scores_tsv: results/pan_cancer_joint_benchmark/unsupervised/feature_selection/hvg_joint_scores.tsv
    hvg_final_gene_list: results/pan_cancer_joint_benchmark/unsupervised/feature_selection/hvg_final_gene_list.txt
profiles:
  pan_cancer:
    analysis:
      cancer_type: Pan-Cancer
      use_pam50: false
    feature_sets:
      distances:
      - euc
      - corr
      methods:
      - Variance
      - MAD
      - Entropy
    paths:
      unsup_root: results/pan_cancer_joint_benchmark/unsupervised
      vst_joint_rds: results/pan_cancer_joint_benchmark/inputs/joint_expr_matrix.rds
      cell_vst_rds: results/pan_cancer_joint_benchmark/inputs/joint_expr_matrix.rds
      tumour_vst_rds: results/pan_cancer_joint_benchmark/inputs/joint_expr_matrix.rds
      dsmz_meta_csv: results/unsupervised/pan_cancer/inputs/joint_metadata.tsv
      meta_tsv: results/unsupervised/pan_cancer/inputs/joint_metadata.tsv
    features:
      pam50_ensembl_gene_list: resources/pam50_ensembl_ids.txt
      hvg_joint_scores_tsv: results/pan_cancer_joint_benchmark/unsupervised/feature_selection/hvg_joint_scores.tsv
      hvg_final_gene_list: results/pan_cancer_joint_benchmark/unsupervised/feature_selection/hvg_final_gene_list.txt
  brca:
    paths:
      vst_joint_rds: data/brca/bcc_analysis_results/vst_dsmz_bcc_tcga_brca_batch_corrected.rds
      unsup_root: results/unsupervised/brca
  nbl:
    paths:
      vst_joint_rds: data/nbl/preprocessing_results/vst_NBL_joint_batch_corrected.rds
      unsup_root: results/unsupervised/nbl
    features:
      hvg_joint_scores_tsv: results/unsupervised/nbl/feature_selection_unsupervised/hvg_joint_scores.tsv
      hvg_final_gene_list: results/unsupervised/nbl/feature_selection_unsupervised/hvg_final_gene_list.txt
  rbl:
    paths:
      vst_joint_rds: data/rbl/preprocessing_results/vst_RBL_joint_batch_corrected.rds
      unsup_root: results/unsupervised/rbl
      cell_vst_rds: data/rbl/preprocessing_results/vst_RBL_joint_batch_corrected.rds
      tumour_vst_rds: data/rbl/preprocessing_results/vst_RBL_joint_batch_corrected.rds
      dsmz_meta_csv: data/dsmz/DSMZ_metadata.csv
      meta_tsv: data/dsmz/DSMZ_metadata.csv
    tumour_neighbourhoods:
      directions:
        - Entropy_corr
        - Entropy_euc
        - MAD_corr
        - MAD_euc
        - MX_corr
        - MX_euc
        - MeanAbsDev_corr
        - MeanAbsDev_euc
        - PCA_corr
        - PCA_euc
        - Spearman_corr
        - Spearman_euc
        - Variance_corr
        - Variance_euc
        - hvg_euc
        - kTotal_corr
        - kTotal_euc
    features:
      hvg_joint_scores_tsv: results/unsupervised/rbl/feature_selection_unsupervised/hvg_joint_scores.tsv
      hvg_final_gene_list: results/unsupervised/rbl/feature_selection_unsupervised/hvg_final_gene_list.txt
  heme:
    analysis:
      cancer_type: HEME
      use_pam50: false
    feature_sets:
      distances: [euc, corr]
      methods:
        - Variance
        - MAD
        - MeanAbsDev
        - Entropy
        - PCA
        - Spearman
        - MX
        - kTotal
    paths:
      unsup_root: results/unsupervised/heme
      vst_joint_rds: results/unsupervised/heme/integrated/heme_joint_expr_vst_batch_corrected.rds
      tumour_vst_rds: data/heme/laml_cll_tumour_vst_batch_corrected.rds
      cell_vst_rds: data/heme/dsmz_ll100_cellline_vst_batch_corrected.rds
      meta_tsv: results/unsupervised/heme/inputs/heme_joint_metadata.tsv
      dsmz_meta_csv: results/unsupervised/heme/inputs/heme_joint_metadata.tsv
    tumour_neighbourhoods:
      directions:
        - Entropy_euc
        - Entropy_corr
        - MAD_euc
        - MAD_corr
        - MeanAbsDev_euc
        - MeanAbsDev_corr
        - MX_euc
        - MX_corr
        - PCA_euc
        - PCA_corr
        - Spearman_euc
        - Spearman_corr
        - Variance_euc
        - Variance_corr
        - kTotal_euc
        - kTotal_corr
    features:
      hvg_joint_scores_tsv: results/unsupervised/heme/feature_selection_unsupervised/hvg_joint_scores.tsv
      hvg_final_gene_list: results/unsupervised/heme/feature_selection_unsupervised/hvg_final_gene_list.txt
paths:
  tumour_nh_base_functions: R/base_functions
  agnostic_base_functions_dir: R
