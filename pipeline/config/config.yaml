features:
  # Plain text list of PAM50 gene symbols
  # was under brca_analysis; move alongside this pipeline:
  pam50_gene_list: /home/chu25/dsmz/pipeline/pipeline/unsupervised/resources/pam50_genes.txt

  # PAM50 Ensembl IDs (matches vst_joint_rds rownames)
  pam50_ensembl_gene_list: /home/chu25/dsmz/pipeline/pipeline/unsupervised/resources/pam50_ensembl_ids.txt

  # HVG feature-selection outputs (created by this pipeline)
  hvg_dir: /home/chu25/dsmz/pipeline/pipeline/unsupervised/results/feature_selection_unsupervised
  hvg_joint_scores_tsv: /home/chu25/dsmz/pipeline/pipeline/unsupervised/results/feature_selection_unsupervised/BRCA_TCGA-DSMZ_HVG500_joint_ranks_kTotal_vs_MX.tsv
  hvg_final_gene_list:  /home/chu25/dsmz/pipeline/pipeline/unsupervised/results/feature_selection_unsupervised/BRCA_TCGA-DSMZ_HVG500_genes_MX_top500.txt

  # Feature selection methods for multi-method benchmarking
  # Each method gets its own directory with expression matrix, similarity matrix, and kNN graph
  methods: ["Variance", "MAD", "MeanAbsDev", "Entropy", "PCA", "Spearman", "MX", "kTotal"]
  
  # Root directory for method-specific outputs (one subdirectory per method)
  method_outdir: /home/chu25/dsmz/pipeline/pipeline/unsupervised/results/featuresets

# Global parameters
feature_selection:
  top_n_method: 3000
  final_top: 500

# Graph construction parameters (for similarity matrix and kNN graph)
graph:
  similarity: spearman    # Similarity metric: "spearman" or "pearson"
  knn_k: 30               # Number of nearest neighbors for kNN graph

clustering:
  # what k-grid to try for k-means / consensus
  k_grid: [2, 3, 4, 5, 6]

# params for the generic 12-way clustering
agnostic_clustering:
  n_pcs: 20
  max_k_hc: 8
  k_min: 2
  k_max: 8
  dist_method: euclidean
  seed: 42

umap:
  n_neighbors: 20
  min_dist: 0.3
  metric_euclidean: euclidean
  metric_correlation: cosine   # use cosine on centered data as proxy for cor

tumour_neighbourhoods:
  # All 16 directions: 8 feature sets × 2 distance metrics
  # PAM50 (legacy, kept for backwards compatibility)
  directions: [
    "pam50_euc", "pam50_corr",
    # 8 feature selection methods × 2 distances
    "Variance_euc", "Variance_corr",
    "MAD_euc", "MAD_corr",
    "MeanAbsDev_euc", "MeanAbsDev_corr",
    "Entropy_euc", "Entropy_corr",
    "PCA_euc", "PCA_corr",
    "Spearman_euc", "Spearman_corr",
    "MX_euc", "MX_corr",
    "kTotal_euc", "kTotal_corr"
  ]
  p_consensus_threshold: 0.7
  top_fraction: 0.10
  min_composite_score: null

methods:
  # Legacy PAM50 methods (kept for backwards compatibility)
  pam50_corr:
    feature: PAM50
    distance: correlation
  pam50_euc:
    feature: PAM50
    distance: euclidean
  # Legacy HVG method (kept for backwards compatibility, but now replaced by 8 methods)
  hvg_corr:
    feature: HVG
    distance: correlation
  hvg_euc:
    feature: HVG
    distance: euclidean
  # New 8 feature selection methods × 2 distances
  Variance_euc:
    feature: Variance
    distance: euclidean
  Variance_corr:
    feature: Variance
    distance: correlation
  MAD_euc:
    feature: MAD
    distance: euclidean
  MAD_corr:
    feature: MAD
    distance: correlation
  MeanAbsDev_euc:
    feature: MeanAbsDev
    distance: euclidean
  MeanAbsDev_corr:
    feature: MeanAbsDev
    distance: correlation
  Entropy_euc:
    feature: Entropy
    distance: euclidean
  Entropy_corr:
    feature: Entropy
    distance: correlation
  PCA_euc:
    feature: PCA
    distance: euclidean
  PCA_corr:
    feature: PCA
    distance: correlation
  Spearman_euc:
    feature: Spearman
    distance: euclidean
  Spearman_corr:
    feature: Spearman
    distance: correlation
  MX_euc:
    feature: MX
    distance: euclidean
  MX_corr:
    feature: MX
    distance: correlation
  kTotal_euc:
    feature: kTotal
    distance: euclidean
  kTotal_corr:
    feature: kTotal
    distance: correlation
