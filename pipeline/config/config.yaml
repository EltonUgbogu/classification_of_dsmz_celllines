defaults:
  paths:
    tumour_nh_base_functions: R/base_functions
    agnostic_base_functions_dir: R
  clustering:
    k_grid: [2, 3, 4, 5, 6, 7, 8]
  feature_selection:
    method_topn:
      Variance:   3000
      MAD:        3000
      MeanAbsDev: 3000
      Entropy:    3000
      PCA:        3000
      Spearman:   500
      MX:         500
      kTotal:     500
  deseq2:
    sample_id_col: sample_id
    cell_line_col: cell_line
    component_col: component
    fdr_isolate: 0.01
    lfc_isolate: 1.5
    topN_isolate: 50
    fdr_anchor: 0.05
    lfc_anchor: 1.0
    topN_anchor: 200
    fdr_component: 0.05
    lfc_component: 1.0
    topN_component: 500
    min_baseMean: 10
    recurrence_k: 2
    enabled_profiles:
      - brca
      - nbl
      - rbl
  marker_postprocessing:
    enabled: true
    consensus:
      enabled: true
      outdir_name: consensus_markers
      padj: 0.05
      basemean: 1.0
      lfc: 0.5
      core_support_min: 2
      core_support_frac: 0.30
      min_anchor_genes: 25
      fallback_topn: 200
      flip_policy: remove
      recurrence_k: 2
    pan_cancer:
      enabled: true
      disease_profiles: [brca, nbl, rbl]
      outdir: results/unsupervised/pan_cancer/feature_space
      final_features_tsv: results/unsupervised/pan_cancer/feature_space/pan_cancer_features.tsv
      final_features_clean: results/unsupervised/pan_cancer/feature_space/pan_cancer_features_clean.txt
      final_features_up: results/unsupervised/pan_cancer/feature_space/pan_cancer_features.UP.txt
      final_features_down: results/unsupervised/pan_cancer/feature_space/pan_cancer_features.DOWN.txt
      build_summary_tsv: results/unsupervised/pan_cancer/feature_space/pan_cancer_feature_build_summary.tsv
      min_cross_disease: 2
      cap_specific: 300
      remove_ribo_mt: false
      gene_annotation_tsv: ""
    expression_matrix:
      include_heme: true
      metadata_fallback_csv: data/dsmz/DSMZ_metadata.csv
      output_rds: results/unsupervised/pan_cancer/inputs/pan_cancer_feature_expr.rds
      output_meta_tsv: results/unsupervised/pan_cancer/inputs/pan_cancer_feature_expr_metadata.tsv
    mapping:
      output_dir: results/unsupervised/pan_cancer/tumour_mapping
      top_k: 10
      similarity: spearman
      zscore_cohort: true
      drop_global_genes: true
      global_gene_regex: "^RPL|^RPS|^MT-|^HIST"
      gene_symbol_map: ""

# Top-level multicohort_cancer block: read by the Snakefile to drive the
# multicohort joint benchmark (feature_methods, dist_metrics, profiles,
# outdir, run_validation). Mirrors profiles.multicohort_cancer semantics.
multicohort_cancer:
  dist_metrics:
    - euc
    - corr
  feature_methods:
    - Variance
    - MAD
    - MeanAbsDev
    - Entropy
    - PCA
    - Spearman
    - MX
    - kTotal
  outdir: results/multicohort_cancer_benchmark
  run_validation: true
  profiles:
    - brca
    - nbl
    - rbl
    - heme
  tumour_neighbourhoods:
    p_consensus_threshold: 0.7
  validation:
    outdir: results/unsupervised/pan_cancer
  paths:
    unsup_root: results/multicohort_cancer_benchmark/unsupervised
    vst_joint_rds: results/multicohort_cancer_benchmark/inputs/joint_expr_matrix.rds
  features:
    hvg_joint_scores_tsv: results/multicohort_cancer_benchmark/unsupervised/feature_selection/hvg_joint_scores.tsv
    hvg_final_gene_list: results/multicohort_cancer_benchmark/unsupervised/feature_selection/hvg_final_gene_list.txt

profiles:
  # ---------------------------------------------------------------------------
  # multicohort_cancer — full 8-method × 2-distance grid; no PAM50
  # ---------------------------------------------------------------------------
  multicohort_cancer:
    analysis:
      cancer_type: Multicohort Cancer
      use_pam50: false
    feature_sets:
      distances:
        - euc
        - corr
      methods:
        - Variance
        - MAD
        - MeanAbsDev
        - Entropy
        - PCA
        - Spearman
        - MX
        - kTotal
    paths:
      unsup_root: results/multicohort_cancer_benchmark/unsupervised
      vst_joint_rds: results/multicohort_cancer_benchmark/inputs/joint_expr_matrix.rds
      cell_vst_rds: results/multicohort_cancer_benchmark/inputs/joint_expr_matrix.rds
      tumour_vst_rds: results/multicohort_cancer_benchmark/inputs/joint_expr_matrix.rds
      dsmz_meta_csv: results/multicohort_cancer_benchmark/inputs/joint_metadata.tsv
      meta_tsv: results/multicohort_cancer_benchmark/inputs/joint_metadata.tsv
    tumour_neighbourhoods:
      directions:
        - Variance_euc
        - Variance_corr
        - MAD_euc
        - MAD_corr
        - MeanAbsDev_euc
        - MeanAbsDev_corr
        - Entropy_euc
        - Entropy_corr
        - PCA_euc
        - PCA_corr
        - Spearman_euc
        - Spearman_corr
        - MX_euc
        - MX_corr
        - kTotal_euc
        - kTotal_corr
    features:
      hvg_joint_scores_tsv: results/multicohort_cancer_benchmark/unsupervised/feature_selection/hvg_joint_scores.tsv
      hvg_final_gene_list: results/multicohort_cancer_benchmark/unsupervised/feature_selection/hvg_final_gene_list.txt

  # ---------------------------------------------------------------------------
  # brca — full 8-method × 2-distance grid
  # PAM50 disabled until tcga_brca_pam50_expr and dsmz_bcc_pam50_expr paths
  # are configured under paths. Re-enable use_pam50 and restore pam50_euc/
  # pam50_corr directions once those expression matrices are available.
  # ---------------------------------------------------------------------------
  brca:
    analysis:
      cancer_type: BRCA
      use_pam50: false
    feature_sets:
      distances:
        - euc
        - corr
      methods:
        - Variance
        - MAD
        - MeanAbsDev
        - Entropy
        - PCA
        - Spearman
        - MX
        - kTotal
    paths:
      unsup_root: results/unsupervised/brca
      vst_joint_rds: data/brca/bcc_analysis_results/vst_dsmz_bcc_tcga_brca_batch_corrected.rds
      cell_vst_rds: data/brca/bcc_analysis_results/vst_dsmz_bcc_tcga_brca_batch_corrected.rds
      tumour_vst_rds: data/brca/bcc_analysis_results/vst_dsmz_bcc_tcga_brca_batch_corrected.rds
      dsmz_counts_rds: data/dsmz/DSMZ_count_gene.rds
      dsmz_meta_csv: data/dsmz/DSMZ_metadata.csv
      meta_tsv: data/dsmz/DSMZ_metadata.csv
    tumour_neighbourhoods:
      directions:
        - Variance_euc
        - Variance_corr
        - MAD_euc
        - MAD_corr
        - MeanAbsDev_euc
        - MeanAbsDev_corr
        - Entropy_euc
        - Entropy_corr
        - PCA_euc
        - PCA_corr
        - Spearman_euc
        - Spearman_corr
        - MX_euc
        - MX_corr
        - kTotal_euc
        - kTotal_corr
    features:
      pam50_ensembl_gene_list: resources/pam50_ensembl_ids.txt
      hvg_joint_scores_tsv: results/unsupervised/brca/feature_selection_unsupervised/hvg_joint_scores.tsv
      hvg_final_gene_list: results/unsupervised/brca/feature_selection_unsupervised/hvg_final_gene_list.txt

  # ---------------------------------------------------------------------------
  # nbl — full 8-method × 2-distance grid; no PAM50
