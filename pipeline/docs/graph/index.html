<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cell line similarity network</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=JetBrains+Mono:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#06080c;--surface:#0d1117;--surface2:#161b22;--border:#21262d;
--text:#e6edf3;--text2:#8b949e;--text3:#484f58;--accent:#58a6ff;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh}
#app{display:grid;grid-template-columns:260px 1fr;height:100vh}

.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;z-index:10}
.sidebar-header{padding:20px 20px 0;flex-shrink:0}
.sidebar-header h1{font-size:16px;font-weight:500;letter-spacing:-.02em;color:var(--text);line-height:1.3}
.sidebar-header p{font-size:12px;color:var(--text2);margin-top:6px;line-height:1.5}

.search-wrap{padding:12px 20px;flex-shrink:0}
.search-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--text);font-size:12px;font-family:'JetBrains Mono',monospace;outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--text3)}

.section-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);padding:4px 20px 6px;flex-shrink:0}

.community-list{padding:0 12px;flex-shrink:0}
.comm-btn{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:none;background:transparent;border-radius:5px;cursor:pointer;transition:background .15s;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text2);text-align:left}
.comm-btn:hover{background:var(--surface2)}
.comm-btn.active{color:var(--text)}
.comm-btn .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:opacity .2s}
.comm-btn.dimmed .dot{opacity:.25}
.comm-btn .count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3)}

.stats-panel{margin-top:auto;padding:16px 20px;border-top:1px solid var(--border);flex-shrink:0}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
.stat-label{font-size:11px;color:var(--text3)}
.stat-value{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text2)}

.graph-area{position:relative;overflow:hidden;background:var(--bg)}
.graph-area svg{display:block;width:100%;height:100%}

.hull{fill-opacity:.04;stroke-opacity:.15;stroke-width:1.5;stroke-dasharray:4 3;pointer-events:none;transition:fill-opacity .3s,stroke-opacity .3s}
.hull.highlight{fill-opacity:.08;stroke-opacity:.3}

.link{stroke-linecap:round;transition:stroke-opacity .3s}
.link.cross{stroke-dasharray:3 4}
.link.dimmed{stroke-opacity:.03!important}
.link.highlight{stroke-opacity:.6!important}

.node-g{cursor:pointer}
.node-circle{stroke-width:1.5;transition:r .2s,stroke-width .2s,filter .2s}
.node-g:hover .node-circle{stroke-width:2.5}
.node-g.highlight .node-circle{filter:drop-shadow(0 0 6px currentColor)}
.node-g.dimmed .node-circle{opacity:.12}
.node-label{font-family:'JetBrains Mono',monospace;font-size:8.5px;fill:var(--text3);pointer-events:none;transition:opacity .3s,fill .3s}
.node-g.highlight .node-label{fill:var(--text);opacity:1}
.node-g.dimmed .node-label{opacity:.08}

.node-g.pinned .node-circle{stroke-dasharray:3 2}

#tooltip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;z-index:100;
background:rgba(13,17,23,.92);backdrop-filter:blur(12px);border:1px solid var(--border);
border-radius:8px;padding:10px 14px;min-width:180px;font-size:12px;color:var(--text2)}
#tooltip .tt-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px}
#tooltip .tt-comm{font-size:11px;margin-bottom:6px}
#tooltip .tt-comm .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
#tooltip .tt-stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:11px}
#tooltip .tt-val{font-family:'JetBrains Mono',monospace;color:var(--text)}
#tooltip .tt-neighbours{margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-size:10px;color:var(--text3);line-height:1.5}

.controls{position:absolute;bottom:16px;right:16px;display:flex;gap:6px}
.ctrl-btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text2);width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:background .15s,color .15s}
.ctrl-btn:hover{background:var(--surface2);color:var(--text)}

.badge{position:absolute;top:16px;right:16px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;pointer-events:none;opacity:0;transition:opacity .3s}
.badge.show{opacity:1}
</style>
</head>
<body>
<div id="app">
<div class="sidebar">
  <div class="sidebar-header">
    <h1>Cell line similarity network</h1>
    <p>Force-directed graph of DSMZ cell line communities detected via Louvain clustering on co-expression similarity. Illustrative data.</p>
  </div>
  <div class="search-wrap"><input id="search" type="text" placeholder="Search cell line…" spellcheck="false" autocomplete="off"></div>
  <div class="section-label">Communities</div>
  <div class="community-list" id="commList"></div>
  <div class="stats-panel" id="statsPanel"></div>
</div>
<div class="graph-area" id="graphArea">
  <svg id="svg"></svg>
  <div id="tooltip"></div>
  <div class="badge" id="badge"></div>
  <div class="controls">
    <button class="ctrl-btn" id="btnReset" title="Reset view">⟲</button>
    <button class="ctrl-btn" id="btnZoomIn" title="Zoom in">+</button>
    <button class="ctrl-btn" id="btnZoomOut" title="Zoom out">−</button>
  </div>
</div>
</div>
<script>
const communityMeta = {
  0:{name:"Isolate",color:"#6e7681"},
  1:{name:"Breast carcinoma",color:"#58a6ff"},
  2:{name:"Neuroblastoma",color:"#f0883e"},
  3:{name:"Retinoblastoma",color:"#3fb950"},
  4:{name:"AML / Leukaemia",color:"#bc8cff"},
  5:{name:"Lymphoma (DLBCL)",color:"#f778ba"},
  6:{name:"Ewing sarcoma",color:"#d29922"},
  7:{name:"Glioblastoma",color:"#ff7b72"},
  8:{name:"Melanoma",color:"#79c0ff"}
};

const data={nodes:[
{id:"MCF-7",group:1},{id:"MDA-MB-231",group:1},{id:"T-47D",group:1},
{id:"BT-474",group:1},{id:"SK-BR-3",group:1},{id:"ZR-75-1",group:1},
{id:"MDA-MB-468",group:1},{id:"HCC1937",group:1},
{id:"SH-SY5Y",group:2},{id:"SK-N-AS",group:2},{id:"IMR-32",group:2},
{id:"SK-N-SH",group:2},{id:"Kelly",group:2},{id:"LAN-1",group:2},{id:"CHP-212",group:2},
{id:"Y79",group:3},{id:"WERI-Rb-1",group:3},{id:"RB355",group:3},
{id:"SO-Rb-50",group:3},{id:"RBL-13",group:3},
{id:"HL-60",group:4},{id:"K-562",group:4},{id:"MOLM-13",group:4},
{id:"MV4-11",group:4},{id:"THP-1",group:4},{id:"U-937",group:4},
{id:"KG-1",group:4},{id:"Kasumi-1",group:4},{id:"NB-4",group:4},
{id:"Raji",group:5},{id:"Daudi",group:5},{id:"SU-DHL-4",group:5},
{id:"OCI-LY3",group:5},{id:"DOHH-2",group:5},{id:"U-2932",group:5},
{id:"A673",group:6},{id:"SK-ES-1",group:6},{id:"RD-ES",group:6},
{id:"TC-71",group:6},{id:"EW-7",group:6},
{id:"U-87 MG",group:7},{id:"U-251 MG",group:7},{id:"T98G",group:7},
{id:"A172",group:7},{id:"LN-229",group:7},
{id:"A375",group:8},{id:"SK-MEL-28",group:8},{id:"WM115",group:8},
{id:"MeWo",group:8},{id:"SK-MEL-5",group:8},
{id:"HEK-293",group:0},{id:"HeLa",group:0},{id:"Jurkat",group:0}
],links:[
{source:"MCF-7",target:"T-47D",value:.92},{source:"MCF-7",target:"ZR-75-1",value:.88},
{source:"T-47D",target:"BT-474",value:.85},{source:"BT-474",target:"SK-BR-3",value:.80},
{source:"MDA-MB-231",target:"MDA-MB-468",value:.87},{source:"MDA-MB-231",target:"HCC1937",value:.78},
{source:"MDA-MB-468",target:"HCC1937",value:.82},{source:"SK-BR-3",target:"ZR-75-1",value:.76},
{source:"MCF-7",target:"BT-474",value:.74},{source:"MDA-MB-231",target:"MCF-7",value:.45},
{source:"SH-SY5Y",target:"SK-N-SH",value:.95},{source:"SH-SY5Y",target:"SK-N-AS",value:.88},
{source:"IMR-32",target:"Kelly",value:.90},{source:"Kelly",target:"LAN-1",value:.86},
{source:"LAN-1",target:"CHP-212",value:.82},{source:"SK-N-AS",target:"IMR-32",value:.79},
{source:"SK-N-SH",target:"Kelly",value:.75},{source:"CHP-212",target:"SH-SY5Y",value:.70},
{source:"Y79",target:"WERI-Rb-1",value:.93},{source:"WERI-Rb-1",target:"RB355",value:.88},
{source:"RB355",target:"SO-Rb-50",value:.85},{source:"SO-Rb-50",target:"RBL-13",value:.82},
{source:"Y79",target:"SO-Rb-50",value:.78},{source:"RBL-13",target:"Y79",value:.74},
{source:"HL-60",target:"NB-4",value:.91},{source:"K-562",target:"MOLM-13",value:.88},
{source:"MOLM-13",target:"MV4-11",value:.93},{source:"MV4-11",target:"THP-1",value:.84},
{source:"THP-1",target:"U-937",value:.86},{source:"U-937",target:"HL-60",value:.80},
{source:"KG-1",target:"Kasumi-1",value:.87},{source:"Kasumi-1",target:"HL-60",value:.79},
{source:"KG-1",target:"K-562",value:.72},{source:"NB-4",target:"THP-1",value:.76},
{source:"Raji",target:"Daudi",value:.92},{source:"SU-DHL-4",target:"OCI-LY3",value:.89},
{source:"OCI-LY3",target:"U-2932",value:.85},{source:"DOHH-2",target:"SU-DHL-4",value:.87},
{source:"Raji",target:"DOHH-2",value:.74},{source:"Daudi",target:"U-2932",value:.71},
{source:"A673",target:"SK-ES-1",value:.91},{source:"SK-ES-1",target:"RD-ES",value:.88},
{source:"RD-ES",target:"TC-71",value:.85},{source:"TC-71",target:"EW-7",value:.83},
{source:"EW-7",target:"A673",value:.80},
{source:"U-87 MG",target:"U-251 MG",value:.90},{source:"U-251 MG",target:"T98G",value:.86},
{source:"T98G",target:"A172",value:.84},{source:"A172",target:"LN-229",value:.82},
{source:"LN-229",target:"U-87 MG",value:.78},
{source:"A375",target:"SK-MEL-28",value:.91},{source:"SK-MEL-28",target:"WM115",value:.86},
{source:"WM115",target:"MeWo",value:.83},{source:"MeWo",target:"SK-MEL-5",value:.80},
{source:"SK-MEL-5",target:"A375",value:.77},
{source:"MDA-MB-231",target:"SH-SY5Y",value:.25},{source:"SK-N-AS",target:"Y79",value:.30},
{source:"U-937",target:"Raji",value:.35},{source:"A673",target:"U-87 MG",value:.28},
{source:"A375",target:"HeLa",value:.20},{source:"Jurkat",target:"K-562",value:.32},
{source:"HEK-293",target:"A172",value:.22},{source:"LN-229",target:"WM115",value:.26}
]};

const nodeMap=new Map(data.nodes.map(n=>[n.id,n]));
const adjMap=new Map();
data.nodes.forEach(n=>adjMap.set(n.id,[]));
data.links.forEach(l=>{
  const s=typeof l.source==='object'?l.source.id:l.source;
  const t=typeof l.target==='object'?l.target.id:l.target;
  adjMap.get(s).push({node:t,value:l.value});
  adjMap.get(t).push({node:s,value:l.value});
});
data.nodes.forEach(n=>{n.degree=adjMap.get(n.id).length;});

const commCounts={};
data.nodes.forEach(n=>{commCounts[n.group]=(commCounts[n.group]||0)+1;});

const activeComms=new Set(Object.keys(communityMeta).map(Number));
let pinnedNode=null;
let hoveredNode=null;

const svg=d3.select("#svg");
const graphArea=document.getElementById("graphArea");
let W=graphArea.clientWidth,H=graphArea.clientHeight;
svg.attr("viewBox",[0,0,W,H]);

const g=svg.append("g");
const hullG=g.append("g").attr("class","hulls-layer");
const linkG=g.append("g").attr("class","links-layer");
const nodeG=g.append("g").attr("class","nodes-layer");

const zoom=d3.zoom().scaleExtent([.2,6]).on("zoom",e=>g.attr("transform",e.transform));
svg.call(zoom);

const simulation=d3.forceSimulation(data.nodes)
  .force("link",d3.forceLink(data.links).id(d=>d.id).distance(d=>{
    const cross=d.source.group!==d.target.group;
    return cross?180:55/d.value;
  }).strength(d=>d.source.group===d.target.group?d.value*.8:.05))
  .force("charge",d3.forceManyBody().strength(-320))
  .force("center",d3.forceCenter(W/2,H/2))
  .force("collide",d3.forceCollide().radius(d=>rScale(d.degree)+6))
  .force("x",d3.forceX(W/2).strength(.03))
  .force("y",d3.forceY(H/2).strength(.03))
  .alphaDecay(.015)
  .velocityDecay(.35);

const rScale=d3.scaleSqrt().domain([1,d3.max(data.nodes,d=>d.degree)]).range([4.5,11]);

const linkEls=linkG.selectAll("line").data(data.links).join("line")
  .attr("class",d=>"link"+(d.source.group!==d.target.group?" cross":""))
  .attr("stroke",d=>{
    const sg=typeof d.source==='object'?d.source.group:nodeMap.get(d.source).group;
    const tg=typeof d.target==='object'?d.target.group:nodeMap.get(d.target).group;
    return sg===tg?communityMeta[sg].color:"#30363d";
  })
  .attr("stroke-width",d=>Math.pow(d.value,1.5)*3)
  .attr("stroke-opacity",d=>d.value*.35);

const nodeEls=nodeG.selectAll("g").data(data.nodes).join("g").attr("class","node-g");
nodeEls.append("circle").attr("class","node-circle")
  .attr("r",d=>rScale(d.degree))
  .attr("fill",d=>communityMeta[d.group].color)
  .attr("stroke",d=>d3.color(communityMeta[d.group].color).brighter(.5));
nodeEls.append("text").attr("class","node-label").attr("dy",d=>-rScale(d.degree)-4).text(d=>d.id);

const hullPadding=28;
function drawHulls(){
  const groups={};
  data.nodes.forEach(n=>{
    if(n.group===0)return;
    if(!activeComms.has(n.group))return;
    if(!groups[n.group])groups[n.group]=[];
    groups[n.group].push([n.x,n.y]);
  });
  const hullData=Object.entries(groups).filter(([,pts])=>pts.length>=3).map(([grp,pts])=>{
    const hull=d3.polygonHull(pts);
    return hull?{group:+grp,path:hull}:null;
  }).filter(Boolean);

  const hulls=hullG.selectAll("path").data(hullData,d=>d.group);
  hulls.exit().remove();
  hulls.enter().append("path").attr("class","hull")
    .attr("fill",d=>communityMeta[d.group].color)
    .attr("stroke",d=>communityMeta[d.group].color)
    .merge(hulls)
    .attr("d",d=>{
      const pts=d.path;
      const cx=d3.mean(pts,p=>p[0]),cy=d3.mean(pts,p=>p[1]);
      const expanded=pts.map(([x,y])=>{
        const dx=x-cx,dy=y-cy,dist=Math.sqrt(dx*dx+dy*dy);
        const f=dist>0?(dist+hullPadding)/dist:1;
        return[cx+dx*f,cy+dy*f];
      });
      return "M"+expanded.join("L")+"Z";
    });
}

const tooltip=document.getElementById("tooltip");
function showTooltip(ev,d){
  const neighbours=adjMap.get(d.id);
  const intra=neighbours.filter(n=>nodeMap.get(n.node).group===d.group);
  const cross=neighbours.filter(n=>nodeMap.get(n.node).group!==d.group);
  const avgSim=neighbours.length?d3.mean(neighbours,n=>n.value):0;
  const topN=neighbours.sort((a,b)=>b.value-a.value).slice(0,4);
  tooltip.innerHTML=`<div class="tt-name">${d.id}</div>
<div class="tt-comm"><span class="dot" style="background:${communityMeta[d.group].color}"></span>${communityMeta[d.group].name}</div>
<div class="tt-stats">
<span>Degree</span><span class="tt-val">${d.degree}</span>
<span>Intra / cross</span><span class="tt-val">${intra.length} / ${cross.length}</span>
<span>Mean sim.</span><span class="tt-val">${avgSim.toFixed(2)}</span>
</div>
<div class="tt-neighbours">Top neighbours: ${topN.map(n=>`${n.node} (${n.value.toFixed(2)})`).join(", ")}</div>`;
  tooltip.style.opacity=1;
  positionTooltip(ev);
}
function positionTooltip(ev){
  const r=graphArea.getBoundingClientRect();
  let x=ev.clientX-r.left+14,y=ev.clientY-r.top-14;
  if(x+200>r.width)x=ev.clientX-r.left-210;
  if(y+120>r.height)y=y-100;
  tooltip.style.left=x+"px";tooltip.style.top=y+"px";
}
function hideTooltip(){tooltip.style.opacity=0;}

function highlightNode(d){
  const nbrs=new Set(adjMap.get(d.id).map(n=>n.node));
  nbrs.add(d.id);
  nodeEls.classed("highlight",n=>nbrs.has(n.id)).classed("dimmed",n=>!nbrs.has(n.id));
  linkEls.classed("highlight",l=>l.source.id===d.id||l.target.id===d.id)
    .classed("dimmed",l=>l.source.id!==d.id&&l.target.id!==d.id);
  hullG.selectAll("path").classed("highlight",h=>h.group===d.group);
}
function clearHighlight(){
  if(pinnedNode)return;
  nodeEls.classed("highlight",false).classed("dimmed",false);
  linkEls.classed("highlight",false).classed("dimmed",false);
  hullG.selectAll("path").classed("highlight",false);
}

nodeEls.on("mouseover",(ev,d)=>{hoveredNode=d;if(!pinnedNode)highlightNode(d);showTooltip(ev,d);})
  .on("mousemove",(ev)=>positionTooltip(ev))
  .on("mouseout",()=>{hoveredNode=null;if(!pinnedNode)clearHighlight();hideTooltip();})
  .on("click",(ev,d)=>{
    ev.stopPropagation();
    if(pinnedNode===d){pinnedNode=null;d.fx=null;d.fy=null;d3.select(ev.currentTarget).classed("pinned",false);clearHighlight();return;}
    if(pinnedNode){pinnedNode.fx=null;pinnedNode.fy=null;nodeEls.classed("pinned",false);}
    pinnedNode=d;d.fx=d.x;d.fy=d.y;d3.select(ev.currentTarget).classed("pinned",true);
    highlightNode(d);showBadge("Click again to unpin");
  })
  .call(d3.drag()
    .on("start",(ev,d)=>{if(!ev.active)simulation.alphaTarget(.15).restart();d.fx=d.x;d.fy=d.y;})
    .on("drag",(ev,d)=>{d.fx=ev.x;d.fy=ev.y;})
    .on("end",(ev,d)=>{if(!ev.active)simulation.alphaTarget(0);if(d!==pinnedNode){d.fx=null;d.fy=null;}}));

svg.on("click",()=>{if(pinnedNode){pinnedNode.fx=null;pinnedNode.fy=null;nodeEls.classed("pinned",false);pinnedNode=null;clearHighlight();}});

simulation.on("tick",()=>{
  linkEls.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y)
    .attr("stroke",d=>d.source.group===d.target.group?communityMeta[d.source.group].color:"#30363d");
  nodeEls.attr("transform",d=>`translate(${d.x},${d.y})`);
  drawHulls();
});

const commList=document.getElementById("commList");
Object.entries(communityMeta).forEach(([k,v])=>{
  const n=+k;
  const btn=document.createElement("button");btn.className="comm-btn active";
  btn.innerHTML=`<span class="dot" style="background:${v.color}"></span><span>${v.name}</span><span class="count">${commCounts[n]||0}</span>`;
  btn.addEventListener("click",()=>{
    if(activeComms.has(n)){activeComms.delete(n);btn.classList.remove("active");btn.classList.add("dimmed");}
    else{activeComms.add(n);btn.classList.add("active");btn.classList.remove("dimmed");}
    applyFilters();
  });
  commList.appendChild(btn);
});

function applyFilters(){
  const q=document.getElementById("search").value.toLowerCase();
  nodeEls.each(function(d){
    const commVis=activeComms.has(d.group);
    const searchVis=!q||d.id.toLowerCase().includes(q);
    const vis=commVis&&searchVis;
    d3.select(this).style("display",vis?null:"none");
    d._visible=vis;
  });
  linkEls.each(function(d){
    const vis=d.source._visible&&d.target._visible;
    d3.select(this).style("display",vis?null:"none");
  });
  drawHulls();
  updateStats();
}

document.getElementById("search").addEventListener("input",()=>{applyFilters();
  const q=document.getElementById("search").value.toLowerCase();
  if(q.length>=2){
    const match=data.nodes.find(n=>n.id.toLowerCase()===q);
    if(match&&match._visible!==false){highlightNode(match);}
  }else if(!pinnedNode){clearHighlight();}
});

function updateStats(){
  const visNodes=data.nodes.filter(n=>n._visible!==false);
  const visLinks=data.links.filter(l=>l.source._visible!==false&&l.target._visible!==false);
  const intra=visLinks.filter(l=>l.source.group===l.target.group).length;
  const cross=visLinks.length-intra;
  const panel=document.getElementById("statsPanel");
  panel.innerHTML=`
<div class="stat-row"><span class="stat-label">Nodes</span><span class="stat-value">${visNodes.length}</span></div>
<div class="stat-row"><span class="stat-label">Edges</span><span class="stat-value">${visLinks.length}</span></div>
<div class="stat-row"><span class="stat-label">Intra-comm.</span><span class="stat-value">${intra}</span></div>
<div class="stat-row"><span class="stat-label">Cross-comm.</span><span class="stat-value">${cross}</span></div>
<div class="stat-row"><span class="stat-label">Communities</span><span class="stat-value">${activeComms.size}</span></div>`;
}
updateStats();

document.getElementById("btnReset").addEventListener("click",()=>{svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity);});
document.getElementById("btnZoomIn").addEventListener("click",()=>{svg.transition().duration(300).call(zoom.scaleBy,1.4);});
document.getElementById("btnZoomOut").addEventListener("click",()=>{svg.transition().duration(300).call(zoom.scaleBy,.7);});

const badge=document.getElementById("badge");
let badgeTimer;
function showBadge(msg){badge.textContent=msg;badge.classList.add("show");clearTimeout(badgeTimer);badgeTimer=setTimeout(()=>badge.classList.remove("show"),2000);}

window.addEventListener("resize",()=>{W=graphArea.clientWidth;H=graphArea.clientHeight;svg.attr("viewBox",[0,0,W,H]);simulation.force("center",d3.forceCenter(W/2,H/2)).force("x",d3.forceX(W/2).strength(.03)).force("y",d3.forceY(H/2).strength(.03));simulation.alpha(.3).restart();});
</script>
