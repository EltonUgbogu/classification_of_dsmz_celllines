# Generic configuration for the preprocessing and quality control workflow
# Usage:
#   snakemake -s preprocessing_and_quality_control/nbl/Snakefile --configfile preprocessing_and_quality_control/nbl/config/config.yaml --cores 12 --use-conda

# Root folder containing one subfolder per project, each with:
#   {project}/fastq/*.fastq.gz
# and where results/logs will be written:
#   {project}/results/, {project}/logs/
# If omitted, the Snakefile falls back to a project-relative data directory.
data_root: "/work/ugbogu/pipeline/data/nbl"
env_dir: "/work/ugbogu/pipeline/preprocessing_and_quality_control/envs"  # shared top-level envs

projects:
  - GSE100148
  - GSE189367
  - SRP409177

threads: 12

genome:
  star_index: "/work/ugbogu/pipeline/data/reference/star_gencode_v44"
  gtf: "/work/ugbogu/pipeline/data/reference/gencode_v44/gencode.v44.basic.annotation.gtf"
  fasta: "/work/ugbogu/pipeline/data/reference/gencode_v44/GRCh38.primary_assembly.genome.fa"

resources:
  star_mem_mb: 42000
  star_bamsort_ram_bytes: 32000000000