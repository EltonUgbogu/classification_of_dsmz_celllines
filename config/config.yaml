study_design:
  file: config/study_design.yaml
  outputs_dirname: study_design

validation:
  shortlist_n: 10
  permutation_iterations: 1000
  random_baseline_iterations: 1000
  seed: 42

defaults:
  paths:
    tumour_nh_base_functions: R/base_functions
    agnostic_base_functions_dir: R
  clustering:
    k_grid: [2, 3, 4, 5, 6, 7, 8]
  feature_selection:
    method_topn:
      Variance:   3000
      MAD:        3000
      MeanAbsDev: 3000
      Entropy:    3000
      PCA:        3000
      Spearman:   500
      MX:         500
      kTotal:     500
      HVG:        3000
  deseq2:
    sample_id_col: sample_name
    staged_sample_id_col: sample_id
    cell_line_col: cell_line
    raw_cell_line_col: DSMZ_Cell_line_norm
    component_col: component
    fdr_isolate: 0.01
    lfc_isolate: 1.5
    topN_isolate: 50
    fdr_anchor: 0.05
    lfc_anchor: 1.0
    topN_anchor: 200
    fdr_component: 0.05
    lfc_component: 1.0
    topN_component: 500
    min_baseMean: 10
    recurrence_k: 2
    enabled_profiles:
      - brca
      - nbl
      - rbl
  community_stability:
    enabled: true
    enabled_profiles:
      - brca
      - nbl
      - rbl
    scope: cell_line_graph_stability_diagnostic
    interpretation: "Leiden/Louvain community detection is used only as an auxiliary cross-direction cell-line graph co-assignment stability check against final resolved graph components."
  enrichment:
    enabled: true
    organism: hsapiens
    min_query_genes: 5
    alpha: 0.05
    correction_method: g_SCS
    sources:
      - GO:BP
      - GO:MF
      - GO:CC
      - KEGG
      - REAC
      - WP
      - TF
      - HPA
      - CORUM
    optional_sources: []
    include_hp: false
    primary_exclude_iea: false
    run_iea_sensitivity: true
    archive_url: "https://biit.cs.ut.ee/gprofiler_archive3/e114_eg62_p19/"
    require_archive: true
    as_short_link: false
    component_marker_pooling: union
    component_recurrence_min: 1
    component_rank_stat: median_abs_log2fc
    strict_union_primary: true
    operative_feature_set_primary: true
    compare_strict_vs_operative: true
    ordered_strict_union: true
    ordered_operative_feature_set: false
    operative_feature_set_rank_source: "initial_run_log2fc"
    operative_feature_set_gene_file: "results/unsupervised/pan_cancer/feature_space/pan_cancer_features_clean.txt"
    operative_feature_set_rank_tsv: ""
    top_terms_per_source: 5
    output_dir_name: enrichment
  marker_postprocessing:
    enabled: true
    consensus:
      enabled: true
      outdir_name: consensus_markers
      padj: 0.05
      basemean: 1.0
      lfc: 0.5
      core_support_min: 2
      core_support_frac: 0.30
      min_anchor_genes: 25
      fallback_topn: 200
      flip_policy: remove
      recurrence_k: 2
    pan_cancer:
      enabled: true
      disease_profiles: [brca, nbl, rbl]
      outdir: results/unsupervised/pan_cancer/feature_space
      final_features_tsv: results/unsupervised/pan_cancer/feature_space/pan_cancer_features.tsv
      final_features_clean: results/unsupervised/pan_cancer/feature_space/pan_cancer_features_clean.txt
      final_features_up: results/unsupervised/pan_cancer/feature_space/pan_cancer_features.UP.txt
      final_features_down: results/unsupervised/pan_cancer/feature_space/pan_cancer_features.DOWN.txt
      build_summary_tsv: results/unsupervised/pan_cancer/feature_space/pan_cancer_feature_build_summary.tsv
      min_cross_disease: 2
      cap_specific: 300
      cap_isolate: 50
      remove_ribo_mt: false
      gene_annotation_tsv: ""
    expression_matrix:
      include_heme: false
      include_heme_cell_lines_only: true
      metadata_fallback_csv: data/dsmz/DSMZ_metadata.csv
      output_rds: results/unsupervised/pan_cancer/inputs/pan_cancer_feature_expr.rds
      output_meta_tsv: results/unsupervised/pan_cancer/inputs/pan_cancer_feature_expr_metadata.tsv
      output_cell_lines_rds: results/unsupervised/pan_cancer/inputs/pan_cancer_feature_expr_cell_lines_only.rds
      output_cell_lines_meta_tsv: results/unsupervised/pan_cancer/inputs/pan_cancer_feature_expr_cell_lines_only_metadata.tsv
    mapping:
      output_dir: results/unsupervised/pan_cancer/tumour_mapping
      top_k: 10
      similarity: spearman
      zscore_cohort: true
      drop_global_genes: true
      global_gene_regex: "^RPL|^RPS|^MT-|^HIST"
      gene_symbol_map: ""

# Top-level multicohort_cancer block: defines source cohorts and shared output location.
# The real analysis grid (methods, distances, directions) is under profiles.multicohort_cancer.
multicohort_cancer:
  outdir: results/unsupervised/multicohort_cancer
  profiles:
    - brca
    - nbl
    - rbl

profiles:
  # ---------------------------------------------------------------------------
  # multicohort_cancer - full 9-method x 2-distance grid
  # ---------------------------------------------------------------------------
  multicohort_cancer:
    analysis:
      cancer_type: Multicohort Cancer
      use_pam50: false
    feature_sets:
      distances:
        - euc
        - corr
      methods:
        - Variance
        - MAD
        - MeanAbsDev
        - Entropy
        - PCA
        - Spearman
        - MX
        - kTotal
        - HVG
    paths:
      unsup_root: results/unsupervised/multicohort_cancer/unsupervised
      vst_joint_rds: results/unsupervised/multicohort_cancer/inputs/joint_expr_matrix.rds
      cell_vst_rds: results/unsupervised/multicohort_cancer/inputs/joint_expr_matrix.rds
      tumour_vst_rds: results/unsupervised/multicohort_cancer/inputs/joint_expr_matrix.rds
      dsmz_meta_csv: results/unsupervised/multicohort_cancer/inputs/joint_metadata.tsv
      meta_tsv: results/unsupervised/multicohort_cancer/inputs/joint_metadata.tsv
    tumour_neighbourhoods:
      directions:
        - Variance_euc
        - Variance_corr
        - MAD_euc
        - MAD_corr
        - MeanAbsDev_euc
        - MeanAbsDev_corr
        - Entropy_euc
        - Entropy_corr
        - PCA_euc
        - PCA_corr
        - Spearman_euc
        - Spearman_corr
        - MX_euc
        - MX_corr
        - kTotal_euc
        - kTotal_corr
        - HVG_euc
        - HVG_corr
        - PanCancerFeatureSet_euc
        - PanCancerFeatureSet_corr
      # Majority-style support threshold m = max(2, ceil(|R| / 2)) for |R|=20.
      # Snakefile recomputes the value from the configured directions and validates this key.
      similarity_consensus_min_support: 10
    features:
      pam50_ensembl_gene_list: resources/pam50_ensembl_ids.txt
      mx_joint_scores_tsv: results/unsupervised/multicohort_cancer/unsupervised/feature_selection/mx_joint_scores.tsv
      mx_final_gene_list: results/unsupervised/multicohort_cancer/unsupervised/feature_selection/mx_final_gene_list.txt
      pan_cancer_feature_set_name: PanCancerFeatureSet
      pan_cancer_feature_set_gene_list: results/unsupervised/pan_cancer/feature_space/pan_cancer_features_clean.txt

  # ---------------------------------------------------------------------------
  # brca - full 9-method x 2-distance grid
  # PAM50 is BRCA-specific in per-disease analyses.
  # ---------------------------------------------------------------------------
  brca:
    analysis:
      cancer_type: BRCA
      use_pam50: true
    feature_sets:
      distances:
        - euc
        - corr
      methods:
        - Variance
        - MAD
        - MeanAbsDev
        - Entropy
        - PCA
        - Spearman
        - MX
        - kTotal
        - HVG
    paths:
      unsup_root: results/unsupervised/brca
      vst_joint_rds: data/brca/brca_vst_joint.rds
      cell_vst_rds: data/brca/tmp/brca_vst_joint_cell_lines.rds
      tumour_vst_rds: data/brca/tmp/brca_vst_joint_tumours.rds
      dsmz_counts_rds: data/dsmz/tmp/DSMZ_vst_joint_from_brca_nbl_rbl.rds
      dsmz_meta_csv: data/dsmz/DSMZ_metadata.csv
      meta_tsv: data/dsmz/DSMZ_metadata.csv
    tumour_neighbourhoods:
      directions:
        - Variance_euc
        - Variance_corr
        - MAD_euc
        - MAD_corr
        - MeanAbsDev_euc
        - MeanAbsDev_corr
        - Entropy_euc
        - Entropy_corr
        - PCA_euc
        - PCA_corr
        - Spearman_euc
        - Spearman_corr
        - MX_euc
        - MX_corr
        - kTotal_euc
        - kTotal_corr
        - HVG_euc
        - HVG_corr
        - pam50_euc
        - pam50_corr
      # Majority-style support threshold m = max(2, ceil(|R| / 2)) for |R|=20
      # (includes pam50_{euc,corr}). Must be explicit per cohort (no silent fallback).
      similarity_consensus_min_support: 10
    features:
      pam50_ensembl_gene_list: resources/pam50_ensembl_ids.txt
      mx_joint_scores_tsv: results/unsupervised/brca/feature_selection_unsupervised/mx_joint_scores.tsv
      mx_final_gene_list: results/unsupervised/brca/feature_selection_unsupervised/mx_final_gene_list.txt

  # ---------------------------------------------------------------------------
  # nbl - full 9-method x 2-distance grid (PAM50 is not applicable; non-BRCA per-disease profile)
  # ---------------------------------------------------------------------------
  nbl:
    analysis:
      cancer_type: NBL
      use_pam50: false
    feature_sets:
      distances:
        - euc
        - corr
      methods:
        - Variance
        - MAD
        - MeanAbsDev
        - Entropy
        - PCA
        - Spearman
        - MX
        - kTotal
        - HVG
    paths:
      unsup_root: results/unsupervised/nbl
      vst_joint_rds: data/nbl/nbl_vst_joint.rds
      cell_vst_rds: data/nbl/tmp/nbl_vst_joint_cell_lines.rds
      tumour_vst_rds: data/nbl/tmp/nbl_vst_joint_tumours.rds
      dsmz_counts_rds: data/dsmz/tmp/DSMZ_vst_joint_from_brca_nbl_rbl.rds
      dsmz_meta_csv: data/dsmz/DSMZ_metadata.csv
      meta_tsv: data/dsmz/DSMZ_metadata.csv
    tumour_neighbourhoods:
      directions:
        - Variance_euc
        - Variance_corr
        - MAD_euc
        - MAD_corr
        - MeanAbsDev_euc
        - MeanAbsDev_corr
        - Entropy_euc
        - Entropy_corr
        - PCA_euc
        - PCA_corr
        - Spearman_euc
        - Spearman_corr
        - MX_euc
        - MX_corr
        - kTotal_euc
        - kTotal_corr
        - HVG_euc
        - HVG_corr
      # Majority-style support threshold m = max(2, ceil(|R| / 2)) for |R|=18.
      # Must be explicit per cohort (no silent fallback).
      similarity_consensus_min_support: 9
    features:
      mx_joint_scores_tsv: results/unsupervised/nbl/feature_selection_unsupervised/mx_joint_scores.tsv
      mx_final_gene_list: results/unsupervised/nbl/feature_selection_unsupervised/mx_final_gene_list.txt

  # ---------------------------------------------------------------------------
  # rbl - full 9-method x 2-distance grid (PAM50 is not applicable; non-BRCA per-disease profile)
  # ---------------------------------------------------------------------------
  rbl:
    analysis:
      cancer_type: RBL
      use_pam50: false
    feature_sets:
      distances:
        - euc
        - corr
      methods:
        - Variance
        - MAD
        - MeanAbsDev
        - Entropy
        - PCA
        - Spearman
        - MX
        - kTotal
        - HVG
    paths:
      unsup_root: results/unsupervised/rbl
      vst_joint_rds: data/rbl/rbl_vst_joint.rds
      cell_vst_rds: data/rbl/tmp/rbl_vst_joint_cell_lines.rds
      tumour_vst_rds: data/rbl/tmp/rbl_vst_joint_tumours.rds
      dsmz_counts_rds: data/dsmz/tmp/DSMZ_vst_joint_from_brca_nbl_rbl.rds
      dsmz_meta_csv: data/dsmz/DSMZ_metadata.csv
      meta_tsv: data/dsmz/DSMZ_metadata.csv
    tumour_neighbourhoods:
      directions:
        - Variance_euc
        - Variance_corr
        - MAD_euc
        - MAD_corr
        - MeanAbsDev_euc
        - MeanAbsDev_corr
        - Entropy_euc
        - Entropy_corr
        - PCA_euc
        - PCA_corr
        - Spearman_euc
        - Spearman_corr
        - MX_euc
        - MX_corr
        - kTotal_euc
        - kTotal_corr
        - HVG_euc
        - HVG_corr
      # Majority-style support threshold m = max(2, ceil(|R| / 2)) for |R|=18.
      # Must be explicit per cohort (no silent fallback).
      similarity_consensus_min_support: 9
    features:
      mx_joint_scores_tsv: results/unsupervised/rbl/feature_selection_unsupervised/mx_joint_scores.tsv
      mx_final_gene_list: results/unsupervised/rbl/feature_selection_unsupervised/mx_final_gene_list.txt

  # ---------------------------------------------------------------------------
  # heme - full 9-method x 2-distance grid (PAM50 is not applicable; non-BRCA per-disease profile)
  # ---------------------------------------------------------------------------
  heme:
    analysis:
      cancer_type: HEME
      use_pam50: false
    feature_sets:
      distances:
        - euc
        - corr
      methods:
        - Variance
        - MAD
        - MeanAbsDev
        - Entropy
        - PCA
        - Spearman
        - MX
        - kTotal
        - HVG
    paths:
      unsup_root: results/unsupervised/heme
      vst_joint_rds: data/heme/heme_joint_expr_vst_batch_corrected.rds
      cell_vst_rds: data/heme/dsmz_ll100_cellline_vst_batch_corrected.rds
      tumour_vst_rds: data/heme/laml_cll_tumour_vst_batch_corrected.rds
      meta_tsv: results/unsupervised/heme/inputs/heme_joint_metadata.tsv
      dsmz_meta_csv: results/unsupervised/heme/inputs/heme_joint_metadata.tsv
    tumour_neighbourhoods:
      directions:
        - Variance_euc
        - Variance_corr
        - MAD_euc
        - MAD_corr
        - MeanAbsDev_euc
        - MeanAbsDev_corr
        - Entropy_euc
        - Entropy_corr
        - PCA_euc
        - PCA_corr
        - Spearman_euc
        - Spearman_corr
        - MX_euc
        - MX_corr
        - kTotal_euc
        - kTotal_corr
        - HVG_euc
        - HVG_corr
      # Majority-style support threshold m = max(2, ceil(|R| / 2)) for |R|=18.
      # Must be explicit per cohort (no silent fallback).
      similarity_consensus_min_support: 9
    features:
      mx_joint_scores_tsv: results/unsupervised/heme/feature_selection_unsupervised/mx_joint_scores.tsv
      mx_final_gene_list: results/unsupervised/heme/feature_selection_unsupervised/mx_final_gene_list.txt

paths:
  tumour_nh_base_functions: R/base_functions
  agnostic_base_functions_dir: R

# ---------------------------------------------------------------------------
# Pan-cancer cell line similarity network
# Build cell-line-only graph, communities, validation, layout, and figure.
# ---------------------------------------------------------------------------
pan_cancer_cell_line_similarity:
  expr_rds: results/unsupervised/pan_cancer/inputs/pan_cancer_feature_expr_cell_lines_only.rds
  output_dir: results/unsupervised/pan_cancer/cell_line_similarity
  correlation: spearman
  k: 20
  expected_genes: 171
  expected_nodes: 167
  seed: 1
  leiden_resolution: 1.0

pan_cancer_cell_line_plot:
  edges_tsv:       results/unsupervised/pan_cancer/cell_line_similarity/pan_cancer_cell_line_graph_edges.tsv
  communities_tsv: results/unsupervised/pan_cancer/cell_line_similarity/pan_cancer_cell_line_communities.tsv
  layout_tsv:      results/unsupervised/pan_cancer/cell_line_similarity/pan_cancer_cell_line_layout.tsv
  output_dir:      figures
