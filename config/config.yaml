# Defines the external study-design manifest and metadata output directory materialised by the workflow.
study_design:
  file: config/study_design.yaml
  outputs_dirname: study_design

# Optional external artefacts. Relative paths are resolved from the repository
# root; absolute local overrides may be supplied in a private config file.
external_inputs:
  retained_source_contrasts: ""

# Backward-compatibility switches for older explicit target commands. These do
# not define the conceptual analysis identity of any profile.
compatibility:
  allow_legacy_multicohort_pan_cancer_targets: true

# Configures validation parameters for permutation, random-baseline, and shortlist checks.
validation:
  shortlist_n: 10
  permutation_iterations: 1000
  random_baseline_iterations: 1000
  seed: 42

# Defines shared defaults inherited by cohort profile sections unless overridden.
defaults:
  # Locates shared R helper functions used by tumour-neighbourhood and agnostic clustering rules.
  paths:
    tumour_nh_base_functions: R/base_functions
    agnostic_base_functions_dir: R
  # Configures candidate cluster counts evaluated by clustering rules.
  clustering:
    k_grid: [2, 3, 4, 5, 6, 7, 8]
  feature_selection:
    # Sets method-specific feature-selection cutoffs for candidate and refined gene sets.
    method_topn:
      # Broad statistical candidate sets retain larger top-N gene lists.
      Variance:   3000
      MAD:        3000
      MeanAbsDev: 3000
      Entropy:    3000
      PCA:        3000
      # Refined network-derived gene sets retain smaller top-N gene lists.
      Spearman:   500
      MX:         500
      kTotal:     500
      HVG:        3000
  # Defines graph-informed DESeq2 marker filtering thresholds and column mappings.
  deseq2:
    # Maps staged and raw metadata columns consumed by DESeq2 marker rules.
    sample_id_col: sample_name
    staged_sample_id_col: sample_id
    cell_line_col: cell_line
    raw_cell_line_col: DSMZ_Cell_line_norm
    component_col: component
    # Filters isolate-vs-REST graph-derived marker contrasts.
    fdr_isolate: 0.01
    lfc_isolate: 1.5
    topN_isolate: 50
    # Filters anchor-vs-outside-component graph-derived marker contrasts.
    fdr_anchor: 0.05
    lfc_anchor: 1.0
    topN_anchor: 200
    # Filters component-vs-REST graph-derived marker contrasts.
    fdr_component: 0.05
    lfc_component: 1.0
    topN_component: 500
    # Sets expression and recurrence thresholds for retained marker sets.
    min_baseMean: 10
    recurrence_k: 2
    enabled_profiles:
      - brca
      - nbl
      - rbl
  # Routes staged graph-derived DESeq2 inputs for each disease profile.
  deseq2_inputs:
    use_staged_inputs: true
    # Records expected sample counts for staged DESeq2 input validation.
    expected_samples:
      brca: 29
      nbl: 18
      rbl: 11
    # Routes staged count matrices into DESeq2 marker rules.
    staged_counts:
      brca: results/unsupervised/brca/deseq2_inputs/counts.tsv
      nbl: results/unsupervised/nbl/deseq2_inputs/counts.tsv
      rbl: results/unsupervised/rbl/deseq2_inputs/counts.tsv
    # Routes staged metadata with graph components into DESeq2 marker rules.
    staged_metadata:
      brca: results/unsupervised/brca/deseq2_inputs/metadata_with_components.tsv
      nbl: results/unsupervised/nbl/deseq2_inputs/metadata_with_components.tsv
      rbl: results/unsupervised/rbl/deseq2_inputs/metadata_with_components.tsv
    # Routes isolate labels derived from resolved graph components.
    staged_isolate_list:
      brca: results/unsupervised/brca/deseq2_inputs/isolate_list.csv
      nbl: results/unsupervised/nbl/deseq2_inputs/isolate_list.csv
      rbl: results/unsupervised/rbl/deseq2_inputs/isolate_list.csv
    # Routes anchor labels used by anchor-vs-outside-component contrasts.
    staged_anchor_list:
      brca: results/unsupervised/brca/deseq2_inputs/anchor_list.csv
      nbl: results/unsupervised/nbl/deseq2_inputs/anchor_list.csv
      rbl: results/unsupervised/rbl/deseq2_inputs/anchor_list.csv
    # Routes anchor-to-component mappings for anchor-aware marker contrasts.
    staged_anchor_components:
      brca: results/unsupervised/brca/deseq2_inputs/anchor_components.tsv
      nbl: results/unsupervised/nbl/deseq2_inputs/anchor_components.tsv
      rbl: results/unsupervised/rbl/deseq2_inputs/anchor_components.tsv
    # Routes component labels for component-vs-REST marker contrasts.
    staged_components:
      brca: results/unsupervised/brca/deseq2_inputs/components_list.txt
      nbl: results/unsupervised/nbl/deseq2_inputs/components_list.txt
      rbl: results/unsupervised/rbl/deseq2_inputs/components_list.txt
    # Records whether raw source count objects are available for each cohort profile.
    raw_source_available:
      brca: true
      nbl: false
      rbl: false
    # Records provenance for raw or staged count sources.
    raw_source_provenance:
      brca: data/brca/dsmz_brca_counts.rds
      nbl: unavailable; staged counts.tsv validated as integer-like
      rbl: unavailable; staged counts.tsv validated as integer-like
  # Configures community detection as a diagnostic stability analysis against resolved graph components.
  community_stability:
    enabled: true
    enabled_profiles:
      - brca
      - nbl
      - rbl
    scope: cell_line_graph_stability_diagnostic
    interpretation: "Leiden/Louvain community detection is used only as an auxiliary cross-direction cell-line graph co-assignment stability check against final resolved graph components."
  # Configures g:Profiler enrichment, source databases, correction, archive use, and display filtering.
  enrichment:
    enabled: true
    organism: hsapiens
    # Sets query-size and alpha thresholds for enrichment tests.
    min_query_genes: 5
    alpha: 0.05
    correction_method: g_SCS
    # Selects ontology, pathway, regulatory, tissue, and complex source databases.
    sources:
      - GO:BP
      - GO:MF
      - GO:CC
      - KEGG
      - REAC
      - WP
      - TF
      - HPA
      - CORUM
    optional_sources: []
    include_hp: false
    # Configures archive-backed reproducibility and IEA sensitivity settings.
    primary_exclude_iea: false
    run_iea_sensitivity: true
    archive_url: "https://biit.cs.ut.ee/gprofiler_archive3/e114_eg62_p19/"
    require_archive: true
    as_short_link: false
    # Controls source-family marker pooling and operative feature-set settings.
    component_marker_pooling: union
    component_recurrence_min: 1
    component_rank_stat: median_abs_log2fc
    strict_union_primary: true
    operative_feature_set_primary: true
    compare_strict_vs_operative: true
    ordered_strict_union: true
    ordered_operative_feature_set: false
    operative_feature_set_rank_source: "initial_run_log2fc"
    operative_feature_set_gene_file: "results/unsupervised/pan_cancer/feature_space/pan_cancer_features_clean.txt"
    operative_feature_set_rank_tsv: ""
    # Controls display limits and output routing for retained top-term tables.
    top_terms_per_source: 5
    output_dir_name: enrichment
  # Configures post-DESeq2 marker collation, graph-derived feature construction, and pan-cancer outputs.
  marker_postprocessing:
    enabled: true
    # Configures per-profile consensus marker filtering and recurrence handling.
    consensus:
      enabled: true
      outdir_name: consensus_markers
      padj: 0.05
      basemean: 1.0
      lfc: 0.5
      core_support_min: 2
      core_support_frac: 0.30
      min_anchor_genes: 25
      fallback_topn: 200
      flip_policy: remove
      recurrence_k: 2
    # Configures graph-derived marker aggregation and pan-cancer feature selection.
    pan_cancer:
      enabled: true
      # Selects disease profiles contributing graph-derived marker contrasts.
      disease_profiles: [brca, nbl, rbl]
      method: graph_derived_pan_cancer_feature_selection_v1_revised
      # Routes final graph-derived marker panel outputs.
      outdir: results/unsupervised/pan_cancer/feature_space
      final_features_tsv: results/unsupervised/pan_cancer/feature_space/pan_cancer_features.tsv
      final_features_clean: results/unsupervised/pan_cancer/feature_space/pan_cancer_features_clean.txt
      final_features_up: results/unsupervised/pan_cancer/feature_space/pan_cancer_features.UP.txt
      final_features_down: results/unsupervised/pan_cancer/feature_space/pan_cancer_features.DOWN.txt
      final_features_mixed: results/unsupervised/pan_cancer/feature_space/pan_cancer_features.MIXED.txt
      build_summary_tsv: results/unsupervised/pan_cancer/feature_space/pan_cancer_feature_build_summary.tsv
      audit_output_prefix: ranked_marker_source_panel
      empirical_quantile_thresholds:
        adjusted_p_value_quantile: 0.25
        absolute_shrunken_log2fc_quantile: 0.75
        expression_quantile: 0.50
      remove_ribo_mt: false
      # Records optional annotation used by feature-panel exports and filtering.
      gene_annotation_tsv: resources/ensembl_to_symbol.tsv
    # Constructs pan-cancer expression objects from the marker-derived feature panel.
    expression_matrix:
      include_heme: false
      include_heme_cell_lines_only: true
      metadata_fallback_csv: data/dsmz/DSMZ_metadata.csv
      output_rds: results/unsupervised/pan_cancer/inputs/pan_cancer_feature_expr.rds
      output_meta_tsv: results/unsupervised/pan_cancer/inputs/pan_cancer_feature_expr_metadata.tsv
      output_cell_lines_rds: results/unsupervised/pan_cancer/inputs/pan_cancer_feature_expr_cell_lines_only.rds
      output_cell_lines_meta_tsv: results/unsupervised/pan_cancer/inputs/pan_cancer_feature_expr_cell_lines_only_metadata.tsv
    # Configures UMAP visualisation of tumour-cell-line alignment in the pan-cancer feature space.
    tumour_cell_line_alignment_umap:
      output_dir: results/unsupervised/pan_cancer/tumour_cell_line_alignment_umap
      metadata_tsv: results/unsupervised/pan_cancer/inputs/pan_cancer_feature_expr_metadata.tsv
      source_metadata_tsv: results/unsupervised/multicohort_cancer/inputs/joint_metadata.tsv
      metrics: [cosine, euclidean]
      page: deg_set_alignment
      figure_width: 9.0
      figure_height: 7.0
      slide_width: 13.33
      slide_height: 7.5
      legend_position: bottom
      source_cancer_slide_threshold: 6
    # Configures Spearman-based tumour-cell-line mapping and global-gene filtering.
    mapping:
      output_dir: results/unsupervised/pan_cancer/tumour_mapping
      top_k: 10
      similarity: spearman
      zscore_cohort: true
      drop_global_genes: true
      global_gene_regex: "^RPL|^RPS|^MT-|^HIST"
      gene_symbol_map: ""

# Defines multicohort source profiles and shared output root.
# Profile-specific feature-distance directions are configured under profiles.multicohort_cancer.
multicohort_cancer:
  outdir: results/unsupervised/multicohort_cancer
  profiles:
    - brca
    - nbl
    - rbl

