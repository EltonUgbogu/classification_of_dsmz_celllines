# Defines cohort profile metadata, feature-distance grids, input paths, tumour-neighbourhood directions, and support thresholds.
profiles:
  # ---------------------------------------------------------------------------
  # multicohort_cancer combines BRCA, NBL, and RBL and adds PanCancerFeatureSet directions.
  # ---------------------------------------------------------------------------
  multicohort_cancer:
    analysis:
      cancer_type: Multicohort Cancer
      use_pam50: false
    feature_sets:
      distances:
        - euc
        - corr
      methods:
        - Variance
        - MAD
        - MeanAbsDev
        - Entropy
        - PCA
        - Spearman
        - MX
        - kTotal
        - HVG
    paths:
      unsup_root: results/unsupervised/multicohort_cancer
      vst_joint_rds: results/unsupervised/multicohort_cancer/inputs/joint_expr_matrix.rds
      cell_vst_rds: results/unsupervised/multicohort_cancer/inputs/joint_expr_matrix.rds
      tumour_vst_rds: results/unsupervised/multicohort_cancer/inputs/joint_expr_matrix.rds
      dsmz_meta_csv: results/unsupervised/multicohort_cancer/inputs/joint_metadata.tsv
      meta_tsv: results/unsupervised/multicohort_cancer/inputs/joint_metadata.tsv
    tumour_neighbourhoods:
      directions:
        - Variance_euc
        - Variance_corr
        - MAD_euc
        - MAD_corr
        - MeanAbsDev_euc
        - MeanAbsDev_corr
        - Entropy_euc
        - Entropy_corr
        - PCA_euc
        - PCA_corr
        - Spearman_euc
        - Spearman_corr
        - MX_euc
        - MX_corr
        - kTotal_euc
        - kTotal_corr
        - HVG_euc
        - HVG_corr
        - PanCancerFeatureSet_euc
        - PanCancerFeatureSet_corr
      # Similarity-consensus threshold implements m = max(2, ceil(|R| / 2)) for |R|=20.
      # The explicit value avoids silent fallback and is validated by the Snakefile.
      similarity_consensus_min_support: 10
    features:
      pam50_ensembl_gene_list: resources/pam50_ensembl_ids.txt
      mx_joint_scores_tsv: results/unsupervised/multicohort_cancer/feature_selection_unsupervised/mx_joint_scores.tsv
      mx_final_gene_list: results/unsupervised/multicohort_cancer/feature_selection_unsupervised/mx_final_gene_list.txt
      pan_cancer_feature_set_name: PanCancerFeatureSet
      pan_cancer_feature_set_gene_list: results/unsupervised/pan_cancer/feature_space/pan_cancer_features_clean.txt

  # ---------------------------------------------------------------------------
  # pan_cancer is the marker-derived pan-cancer analysis/output profile.
  # It is not a raw cohort; default targets route to results/unsupervised/pan_cancer.
  # ---------------------------------------------------------------------------
  pan_cancer:
    analysis:
      cancer_type: Pan Cancer
      use_pam50: false
    feature_sets:
      distances:
        - euc
        - corr
      methods:
        - Variance
        - MAD
        - MeanAbsDev
        - Entropy
        - PCA
        - Spearman
        - MX
        - kTotal
        - HVG
    paths:
      unsup_root: results/unsupervised/pan_cancer
      vst_joint_rds: results/unsupervised/pan_cancer/inputs/pan_cancer_feature_expr.rds
      cell_vst_rds: results/unsupervised/pan_cancer/inputs/pan_cancer_feature_expr_cell_lines_only.rds
      tumour_vst_rds: results/unsupervised/pan_cancer/inputs/pan_cancer_feature_expr.rds
      dsmz_meta_csv: results/unsupervised/pan_cancer/inputs/pan_cancer_feature_expr_metadata.tsv
      meta_tsv: results/unsupervised/pan_cancer/inputs/pan_cancer_feature_expr_metadata.tsv
    tumour_neighbourhoods:
      # Parse-time fallback for generic rules; pan_cancer default targets do not
      # build patient-referenced tumour-neighbourhood graphs.
      similarity_consensus_min_support: 9
    deseq2:
      enabled: false
    enrichment:
      enabled: false

  # ---------------------------------------------------------------------------
  # brca uses the full unsupervised feature-selection grid plus PAM50 directions.
  # ---------------------------------------------------------------------------
  brca:
    analysis:
      cancer_type: BRCA
      use_pam50: true
    feature_sets:
      distances:
        - euc
        - corr
      methods:
        - Variance
        - MAD
        - MeanAbsDev
        - Entropy
        - PCA
        - Spearman
        - MX
        - kTotal
        - HVG
    paths:
      unsup_root: results/unsupervised/brca
      vst_joint_rds: data/brca/brca_vst_joint.rds
      cell_vst_rds: data/brca/tmp/brca_vst_joint_cell_lines.rds
      tumour_vst_rds: data/brca/tmp/brca_vst_joint_tumours.rds
      dsmz_counts_rds: data/dsmz/tmp/DSMZ_vst_joint_from_brca_nbl_rbl.rds
      dsmz_meta_csv: data/dsmz/DSMZ_metadata.csv
      meta_tsv: data/dsmz/DSMZ_metadata.csv
    tumour_neighbourhoods:
      directions:
        - Variance_euc
        - Variance_corr
        - MAD_euc
        - MAD_corr
        - MeanAbsDev_euc
        - MeanAbsDev_corr
        - Entropy_euc
        - Entropy_corr
        - PCA_euc
        - PCA_corr
        - Spearman_euc
