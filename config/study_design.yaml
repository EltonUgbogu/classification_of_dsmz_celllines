study:
  title: "Patient-referenced cell-line similarity and p-consensus robustness across cancer cohorts"
  primary_question: >
    Which cancer cell lines receive the strongest patient-referenced tumour-neighbourhood
    support within each cancer type, and how stable is that support across
    feature--distance representations?
  primary_endpoint: "ranked cell-line support within tumour-neighbourhood analyses"
  secondary_endpoints:
    - "p-consensus robustness across feature--distance representations"
    - "community context in the resolved patient-referenced cell-line neighbourhood graph"
    - "cancer-type concordance as post-hoc validation when labels exist on disk"
  scope_note: >
    Core inference is unsupervised. Cancer-type labels are used for post-hoc validation
    and do not alter the ranking procedure.

candidate_inference:
  cell_line_panel: "DSMZ"
  feature_selection_methods:
    - "Variance"
    - "MAD"
    - "MeanAbsDev"
    - "Entropy"
    - "PCA"
    - "Spearman"
    - "MX"
    - "kTotal"
    - "HVG"
  distance_metrics:
    - "euc"
    - "corr"
  clustering_algorithms:
    - "hierarchical"
    - "kmeans"
  k_grid:
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
  consensus_metric:
    name: "p_consensus"
    definition: "proportion of configured analytical runs supporting a tumour--cell-line neighbourhood"
    strong_support_threshold: 0.7
  final_ranking:
    summary_table: "tumour_neighbourhoods/final_consensus_all/p_consensus_best_cell_lines_ranked.tsv"
    ranking_fields:
      - "composite_score"
      - "frac_ge_thr"
      - "median_p"
      - "max_p"
    note: >
      validation/04_model_selection_summary.R reports the ranking rule already emitted by
      summarize_p_consensus_all.R; it does not introduce a new decision system.

validation_framework:
  biological_validation_axes:
    - "cancer-type label concordance when labels exist on disk"
    - "resolved patient-referenced cell-line graph community context"
    - "clustering quality reporting from persisted silhouette artifacts"
  baseline_analyses:
    - "aggregated per-direction label permutation null"
    - "random shortlist baseline"

cohorts:
  brca:
    disease: "Breast cancer"
    tumour_sources:
      - "TCGA-BRCA"
    current_analysis_input: "preprocessing_and_quality_control/brca/results/batch_corr_and_normalisation/purity_filtered_preprocess/joint_vst_purity_filtered_post_bc.rds"
    tumour_purity:
      method: "ESTIMATE/tidyestimate on a tumour-only per-sample rank-normalised expression object derived inside the purity stage from raw primary-tumour counts"
      threshold: 0.70
      samples_before: 830
      samples_retained: 773
      samples_excluded: 57
      scoring_expression: "preprocessing_and_quality_control/brca/results/tumour_purity_analysis/tumour_only_purity_scoring_expression.rds"
      retained_manifest: "preprocessing_and_quality_control/brca/results/tumour_purity_analysis/retained_samples.tsv"
      excluded_manifest: "preprocessing_and_quality_control/brca/results/tumour_purity_analysis/excluded_samples.tsv"
      retained_raw_counts: "preprocessing_and_quality_control/brca/results/tumour_purity_analysis/retained_raw_tumour_counts.rds"
    tumour_selection:
      policy: "Primary tumour sample type followed by configured tumour-purity filtering"
      primary_sample_type: "01"
      pam50_annotation_required: false
      tumour_purity_filtering: true
      evidence: "The active tumour set must exactly equal the retained-sample manifest generated from raw primary-tumour counts"
    cell_line_panel: "DSMZ"
    runtime_labels:
      - label: "PAM50_Subtype"
        entity: "tumour"
        source_file: "data/brca/annotations/TCGA_BRCA_project_subtype.csv"
        status: "implemented"
        purpose: "subtype concordance"

  nbl:
    disease: "Neuroblastoma"
    tumour_sources:
      - "GSE189367"
      - "SRP409177"
      - "TARGET-NBL"
    current_preprocessing_output: "data/nbl/count_data/nbl_tumour_count.rds"
    current_analysis_input: "preprocessing_and_quality_control/nbl/results/batch_corr_and_normalisation/purity_filtered_preprocess/joint_vst_purity_filtered_post_bc.rds"
    tumour_purity:
      method: "Verified ESTIMATE/tidyestimate scores from tumour-only raw counts with the method's internal per-sample rank transformation"
      threshold: 0.70
      samples_before: 273
      samples_retained: 235
      samples_excluded: 38
      scoring_expression: "preprocessing_and_quality_control/nbl/results/tumour_purity_analysis/tumour_only_purity_scoring_expression.rds"
      retained_manifest: "preprocessing_and_quality_control/nbl/results/tumour_purity_analysis/retained_samples.tsv"
      excluded_manifest: "preprocessing_and_quality_control/nbl/results/tumour_purity_analysis/excluded_samples.tsv"
      retained_raw_counts: "preprocessing_and_quality_control/nbl/results/tumour_purity_analysis/retained_raw_tumour_counts.rds"
    cell_line_panel: "DSMZ"
    runtime_labels:
      - label: "cohort"
        entity: "tumour"
        source_file: "data/nbl/count_data/nbl_tumour_sample_metadata.csv"
        status: "implemented"
        purpose: "cohort provenance"
      - label: "MYCN.amplification"
        entity: "cell_line"
        source_file: "data/dsmz/DSMZ_metadata.csv"
        status: "implemented_in_cell_line_metadata"
        purpose: "cell-line biological context"
    notes:
      - "preprocessing_results/GSE49711 entries are legacy and are not part of the active merged cohort"

  rbl:
    disease: "Retinoblastoma"
    tumour_sources:
      - "GSE111168"
      - "GSE196420"
      - "GSE268136"
    current_analysis_input: "preprocessing_and_quality_control/rbl/results/batch_corr_and_normalisation/purity_filtered_preprocess/joint_vst_purity_filtered_post_bc.rds"
    tumour_purity:
      method: "Verified ESTIMATE/tidyestimate scores from tumour-only raw counts with the method's internal per-sample rank transformation"
      threshold: 0.70
      samples_before: 69
      samples_retained: 68
      samples_excluded: 1
      scoring_expression: "preprocessing_and_quality_control/rbl/results/tumour_purity_analysis/tumour_only_purity_scoring_expression.rds"
      retained_manifest: "preprocessing_and_quality_control/rbl/results/tumour_purity_analysis/retained_samples.tsv"
      excluded_manifest: "preprocessing_and_quality_control/rbl/results/tumour_purity_analysis/excluded_samples.tsv"
      retained_raw_counts: "preprocessing_and_quality_control/rbl/results/tumour_purity_analysis/retained_raw_tumour_counts.rds"
    cell_line_panel: "DSMZ"
    runtime_labels: []

  heme:
    disease: "Haematological malignancy benchmark"
    tumour_sources:
      - "LAML"
      - "CLL"
    source_evidence: "data/heme/laml_cll_tumour_vst_batch_corrected.rds"
    current_analysis_input: "results/unsupervised/heme/integrated/heme_joint_expr_vst_batch_corrected.rds"
