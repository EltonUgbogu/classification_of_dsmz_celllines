      - "brca"
      - "nbl"
      - "rbl"
    current_analysis_input: "results/unsupervised/multicohort_cancer/inputs/joint_expr_matrix.rds"
    cell_line_panel: "DSMZ"
    runtime_labels:
      - label: "cancer_type"
        entity: "tumour_and_cell_line"
        source_file: "results/unsupervised/multicohort_cancer/inputs/joint_metadata.tsv"
