name: HPC Job Results Sync
# This workflow synchronizes results from HPC/SLURM jobs back to the GitHub repository.
# It is triggered by job completion/failure events, manual dispatch, or a schedule.
# Key functionality: SSH into HPC, commit changes, generate reports, and handle failures.

on:
  repository_dispatch:
    # Triggers on specific event types dispatched from HPC (e.g., via curl in SLURM epilog).
    types: [slurm-job-complete, slurm-job-failed]
  workflow_dispatch:
    # Allows manual triggering via GitHub UI for ad-hoc syncs.
    inputs:
      job_id:
        description: 'Optional Slurm Job ID'  # Used for commit messages and logging.
        required: false
        type: string
  schedule:
    # Automated periodic syncs to catch any missed events or incremental changes.
    - cron: '0 */6 * * *'  # Runs every 6 hours (adjust as needed for frequency).

concurrency:
  # Ensures only one sync runs at a time to avoid race conditions on git operations.
  group: hpc-sync
  cancel-in-progress: false  # Do not cancel ongoing syncs; let them complete.

env:
  # Defines the default branch for git operations; override if using a different main branch.
  DEFAULT_BRANCH: main

jobs:
  sync-results:
    # Core job: Performs the SSH-based sync from HPC to GitHub.
    runs-on: ubuntu-latest  # Uses Ubuntu for compatibility with SSH and git tools.
    steps:
      - name: Checkout repository
        # Clones the full repo history for git diff and commit operations.
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # Uses GITHUB_TOKEN for authenticated pushes.
          fetch-depth: 0  # Fetches all history for accurate diff comparisons.

      - name: Setup SSH (to reach HPC)
        # Initializes SSH agent with the private key for secure, passwordless access to HPC.
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HPC_SSH_KEY }}  # HPC-specific SSH private key.

      - name: Add HPC to known hosts
        # Scans and adds the HPC host to known_hosts to prevent SSH host key verification prompts.
        run: |
          set -euo pipefail  # Enforces strict bash execution: exit on error, undefined vars, or pipe failure.
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh  # Sets secure permissions on SSH directory.
          ssh-keyscan -H "${{ secrets.HPC_HOST }}" >> ~/.ssh/known_hosts  # Hashes host for security.

      - name: Sync and push from HPC
        # SSH into HPC, navigates to project dir, stages/commits changes, and pushes to GitHub.
        run: |
          set -euo pipefail  # Strict bash mode for reliability.
          ssh "${{ secrets.HPC_USER }}@${{ secrets.HPC_HOST }}" bash -lc '
            set -euo pipefail  # Strict mode inside remote session.
            cd "${HPC_PROJECT_PATH:-${{ secrets.HPC_PROJECT_PATH }}}"

            # Validate that the current directory is a git repository.
            if [ ! -d .git ]; then
              echo "[ERROR] ${PWD} is not a git repository (missing .git)"; exit 2
            fi

            # Determine the current branch, falling back to the default if detached HEAD.
            BRANCH=$(git symbolic-ref --quiet --short HEAD || echo "${DEFAULT_BRANCH:-${{ env.DEFAULT_BRANCH }}}")
            git pull --rebase origin "$BRANCH" || true  # Rebase-pull to integrate upstream changes safely.

            # Configure git identity if not already set (ensures commits are attributed correctly).
            git config user.email "${GIT_AUTHOR_EMAIL:-action@github.com}"
            git config user.name  "${GIT_AUTHOR_NAME:-HPC Sync Bot}"

            # Stage all changes (new, modified, deleted files) for commit.
            git add -A

            # Construct a descriptive commit message including job context and timestamp.
            JOB_ID="${{ github.event.client_payload.job_id || github.event.inputs.job_id || '' }}"
            TRIGGER="${{ github.event_name }}"
            TS="$(date "+%Y-%m-%d %H:%M:%S %Z")"
            MSG="HPC Sync: ${JOB_ID:+Job ID: $JOB_ID | }Trigger: $TRIGGER | $TS"

            # Only commit and push if there are staged changes.
            if git diff --cached --quiet; then
              echo "[INFO] No changes to commit on HPC."
              exit 0
            fi

            git commit -m "$MSG"
            git push origin "$BRANCH"  # Pushes to the determined branch.
          '

      - name: Pull latest changes into the repo checkout
        # Updates the local checkout with the just-pushed changes for downstream steps (e.g., diff).
        run: |
          set -euo pipefail
          git pull --rebase origin "${{ env.DEFAULT_BRANCH }}"  # Rebase to maintain linear history.

      - name: Detect newly added/updated result files
        # Analyzes git diff to identify new/updated files matching result patterns (e.g., logs, outputs).
        # Outputs variables for conditional steps.
        id: check_results
        run: |
          set -euo pipefail
          # Determine the git range: compare to previous commit if available, else just HEAD.
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="HEAD"
          fi

          # Extract added/modified files and filter by common result extensions.
          NEW_FILES=$(git diff --name-only --diff-filter=AM $RANGE | \
            grep -E '\.(out|err|log|csv|tsv|png|pdf|txt|json|rds|rdata)$' || true)

          # Set outputs: flag if results found and list the files.
          if [ -n "$NEW_FILES" ]; then
            echo "new_results=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$NEW_FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"  # Multi-line output for file list.
          else
            echo "new_results=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate summary report
        # Conditionally creates a Markdown summary of synced files if changes were detected.
        # Writes to a fixed file for easy tracking in the repo.
        if: steps.check_results.outputs.new_results == 'true'
        run: |
          set -euo pipefail
          mkdir -p reports  # Ensures reports directory exists.
          {
            echo "# HPC Sync Summary"
            echo
            echo "**Date**: $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "**Job ID**: ${{ github.event.client_payload.job_id || github.event.inputs.job_id || 'N/A' }}"
            echo "**Trigger**: ${{ github.event_name }}"
            echo
            echo "## New/Updated Files"
            echo
          } > reports/latest_sync_summary.md  # Initializes the report file.

          # Appends file details (name and size) to the report.
          while read -r file; do
            [ -z "$file" ] && continue  # Skips empty lines.
            SIZE=$( [ -f "$file" ] && du -h "$file" | cut -f1 || echo "n/a" )  # Computes human-readable size.
            echo "- \`$file\` ($SIZE)" >> reports/latest_sync_summary.md
          done <<< "${{ steps.check_results.outputs.files }}"

      - name: Commit summary report
        # Commits and pushes the generated report if files were synced.
        # Uses a standard GitHub Action identity for traceability.
        if: steps.check_results.outputs.new_results == 'true'
        run: |
          set -euo pipefail
          git config user.email "action@github.com"
          git config user.name  "GitHub Action"
          git add reports/latest_sync_summary.md  # Stages the new report.
          git commit -m "Add sync summary report"  # Commits with a simple message.
          git push  # Pushes to the default branch.

      - name: Create issue on job failure
        # Automatically creates a GitHub issue for failed jobs to facilitate debugging and notifications.
        # Only triggers on explicit failure events.
        if: github.event.action == 'slurm-job-failed'
        uses: actions/github-script@v7  # Uses official GitHub API client for issue creation.
        with:
          script: |
            # Creates an issue with structured body including job details.
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Slurm Job Failed: ${context.payload.client_payload?.job_id || 'unknown'}`,
              body: `
              ## Job Failure Report

              **Job ID**: ${context.payload.client_payload?.job_id || 'N/A'}
              **Time**: ${new Date().toISOString()}
              **Error Details**: ${context.payload.client_payload?.error_message || 'N/A'}

              Please check the HPC logs for more details.
              `,
              labels: ['bug', 'hpc', 'slurm']  # Applies standard labels for triage.
            })
