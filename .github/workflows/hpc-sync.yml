name: HPC Job Results Sync

on:
  repository_dispatch:
    types: [slurm-job-complete, slurm-job-failed]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Optional Slurm Job ID'
        required: false
        type: string
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours

concurrency:
  group: hpc-sync
  cancel-in-progress: false

env:
  DEFAULT_BRANCH: main

jobs:
  sync-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup SSH (to reach HPC)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HPC_SSH_KEY }}

      - name: Add HPC to known hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.HPC_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync and push from HPC
        run: |
          set -euo pipefail
          ssh "${{ secrets.HPC_USER }}@${{ secrets.HPC_HOST }}" bash -lc '
            set -euo pipefail
            cd "${HPC_PROJECT_PATH:-${{ secrets.HPC_PROJECT_PATH }}}"

            # Make sure repo is usable
            if [ ! -d .git ]; then
              echo "[ERROR] ${PWD} is not a git repository (missing .git)"; exit 2
            fi

            # Prefer current branch; fallback to DEFAULT_BRANCH
            BRANCH=$(git symbolic-ref --quiet --short HEAD || echo "${DEFAULT_BRANCH:-${{ env.DEFAULT_BRANCH }}}")
            git pull --rebase origin "$BRANCH" || true

            # Git identity (local to repo) in case HPC user has none
            git config user.email "${GIT_AUTHOR_EMAIL:-action@github.com}"
            git config user.name  "${GIT_AUTHOR_NAME:-HPC Sync Bot}"

            # Add new/changed results (tune patterns if needed)
            git add -A

            # Build a commit message with context
            JOB_ID="${{ github.event.client_payload.job_id || github.event.inputs.job_id || '' }}"
            TRIGGER="${{ github.event_name }}"
            TS="$(date "+%Y-%m-%d %H:%M:%S %Z")"
            MSG="HPC Sync: ${JOB_ID:+Job ID: $JOB_ID | }Trigger: $TRIGGER | $TS"

            # Commit only if there are changes
            if git diff --cached --quiet; then
              echo "[INFO] No changes to commit on HPC."
              exit 0
            fi

            git commit -m "$MSG"
            git push origin "$BRANCH"
          '

      - name: Pull latest changes into the repo checkout
        run: |
          set -euo pipefail
          git pull --rebase origin "${{ env.DEFAULT_BRANCH }}"

      - name: Detect newly added/updated result files
        id: check_results
        run: |
          set -euo pipefail
          # Compare against previous commit if present
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="HEAD"
          fi

          NEW_FILES=$(git diff --name-only --diff-filter=AM $RANGE | \
            grep -E '\.(out|err|log|csv|tsv|png|pdf|txt|json|rds|rdata)$' || true)

          if [ -n "$NEW_FILES" ]; then
            echo "new_results=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$NEW_FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "new_results=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate summary report
        if: steps.check_results.outputs.new_results == 'true'
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            echo "# HPC Sync Summary"
            echo
            echo "**Date**: $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "**Job ID**: ${{ github.event.client_payload.job_id || github.event.inputs.job_id || 'N/A' }}"
            echo "**Trigger**: ${{ github.event_name }}"
            echo
            echo "## New/Updated Files"
            echo
          } > reports/latest_sync_summary.md

          while read -r file; do
            [ -z "$file" ] && continue
            SIZE=$( [ -f "$file" ] && du -h "$file" | cut -f1 || echo "n/a" )
            echo "- \`$file\` ($SIZE)" >> reports/latest_sync_summary.md
          done <<< "${{ steps.check_results.outputs.files }}"

      - name: Commit summary report
        if: steps.check_results.outputs.new_results == 'true'
        run: |
          set -euo pipefail
          git config user.email "action@github.com"
          git config user.name  "GitHub Action"
          git add reports/latest_sync_summary.md
          git commit -m "Add sync summary report"
          git push

      - name: Create issue on job failure
        if: github.event.action == 'slurm-job-failed'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Slurm Job Failed: ${context.payload.client_payload?.job_id || 'unknown'}`,
              body: `
              ## Job Failure Report

              **Job ID**: ${context.payload.client_payload?.job_id || 'N/A'}
              **Time**: ${new Date().toISOString()}
              **Error Details**: ${context.payload.client_payload?.error_message || 'N/A'}

              Please check the HPC logs for more details.
              `,
              labels: ['bug', 'hpc', 'slurm']
            })
